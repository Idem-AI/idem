events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimisations TCP
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        # La page prérendue (index.html) avant la coquille rendue dans le navigateur.
        index index.html index.csr.html;

        # Désactiver les logs d'erreur inutiles
        error_log /var/log/nginx/error.log warn;

        # Headers de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Pas de cache pour les fichiers HTML
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Cache agressif pour les assets statiques (PRIORITÉ HAUTE)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Routes EN
        location /en/ {
            # Chaque route est prérendue dans <route>/index.html : c'est ce HTML,
            # complet (titre, canonique, balises de partage, JSON-LD), que les
            # robots doivent recevoir. La coquille CSR n'est qu'un dernier recours.
            try_files $uri/index.html $uri /en/index.csr.html;
        }

        location /en {
            return 301 /en/;
        }

        # Routes FR
        location /fr/ {
            # Chaque route est prérendue dans <route>/index.html : c'est ce HTML,
            # complet (titre, canonique, balises de partage, JSON-LD), que les
            # robots doivent recevoir. La coquille CSR n'est qu'un dernier recours.
            try_files $uri/index.html $uri /fr/index.csr.html;
        }

        location /fr {
            return 301 /fr/;
        }

        # Redirection de la racine avec détection de la langue
        location = / {
            # 1. Vérifier le cookie de langue
            if ($cookie_idem_lang = "fr") {
                return 302 /fr/;
            }
            if ($cookie_idem_lang = "en") {
                return 302 /en/;
            }
            
            # 2. Détecter la langue préférée via l'en-tête Accept-Language
            if ($http_accept_language ~* "^fr") {
                return 302 /fr/;
            }
            if ($http_accept_language ~* "^en") {
                return 302 /en/;
            }
            
            # 3. Langue par défaut
            return 302 /en/;
        }

        # Route par défaut FR - Fallback DIRECT (pas de $uri/)
        location / {
            try_files $uri /index.csr.html /index.html;
        }

        # Gérer les erreurs 404 proprement
        error_page 404 /index.csr.html;

        # Désactiver les logs pour favicon et robots
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            try_files $uri =204;
        }
        
        location = /robots.txt {
            log_not_found off;
            access_log off;
            try_files $uri =204;
        }
    }
}
