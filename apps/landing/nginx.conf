# Modules Brotli (paquet Alpine `nginx-mod-http-brotli`). Brotli gagne environ
# 16 % sur le JS et 17 % sur le HTML par rapport à gzip : sur un lien à 30 Ko/s,
# c'est plusieurs secondes de moins à chaque premier chargement.
load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

user nginx;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimisations TCP
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;

    # ------------------------------------------------------------------
    # Politique de cache
    # ------------------------------------------------------------------
    # Elle est pilotée par le TYPE DE CONTENU, pas par l'extension de l'URL.
    # C'est indispensable ici : la landing est prérendue en dossiers
    # (`/fr/about/index.html`) servis sur des URL qui finissent par `/`, et non
    # par `.html`. L'ancienne règle `location ~* \.html$` ne les atteignait
    # jamais : ces pages partaient sans aucun `Cache-Control`, les navigateurs
    # appliquaient leur cache heuristique et gardaient des semaines une version
    # périmée — dont les noms de fichiers JS/CSS hachés n'existaient plus.
    #
    # 1) Les noms de fichiers portant une empreinte de build sont figés à vie.
    map $uri $idem_uri_cc {
        default "";

        # Le service worker et son manifeste décident des mises à jour :
        # les mettre en cache reviendrait à geler l'application.
        "~*^/(?:sw|ngsw-worker|safety-worker)\.js$"  "no-cache, no-store, must-revalidate";
        "~*^/ngsw\.json$"                            "no-cache, no-store, must-revalidate";

        # Les traductions gardent le même nom d'un déploiement à l'autre.
        "~*^/assets/i18n/"                           "no-cache";

        # Empreinte de build (`main-YLYYMSTG.js`, `styles-T7NVI7CN.css`) et
        # dossier `media/` (polices) : contenu adressé par son nom.
        "~*-[A-Za-z0-9_-]{8,}\.(?:js|mjs|css|woff2|woff|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|avif|wasm)$"  "public, max-age=31536000, immutable";
        "~*^/media/"                                 "public, max-age=31536000, immutable";
    }

    # 2) Sinon, le type de contenu tranche.
    map $sent_http_content_type $idem_type_cc {
        # Assets non hachés (images de `public/assets`) : une semaine, puis
        # revalidation — et réutilisation pendant la revalidation.
        default                         "public, max-age=604800, stale-while-revalidate=86400";
        "~*^text/html"                  "no-cache, must-revalidate";
        "~*^application/json"           "no-cache";
        "~*^application/manifest\+json" "no-cache";
        "~*^text/xml"                   "no-cache";
        "~*^application/xml"            "no-cache";
    }

    # Négociation de contenu pour les images.
    #
    # Les PNG/JPEG de `public/assets` pèsent lourd (19 Mo sur iDeploy, 6,7 Mo
    # sur le tableau de bord) et ne sont ni redimensionnés ni convertis. Plutôt
    # que de renommer des centaines de références dans les gabarits — au risque
    # d'en oublier — le build fabrique un `.webp` à côté de chaque image et
    # nginx le sert aux navigateurs qui l'acceptent. Les autres reçoivent
    # l'original : rien ne casse, et l'URL ne change pas.
    map $http_accept $idem_webp {
        default        "";
        "~*image/webp" ".webp";
    }

    map $idem_uri_cc $idem_cache_control {
        ""      $idem_type_cc;
        default $idem_uri_cc;
    }

    # Une erreur ne se met jamais en cache. Sans cette carte, un 404 passager
    # pendant un déploiement repartait avec `immutable` : le navigateur aurait
    # gardé l'absence du fichier pendant un an.
    map $status $idem_cc_final {
        default   $idem_cache_control;
        "~^[45]"  "no-store";
    }

    # Sortie forcée des appareils bloqués sur une ancienne landing.
    # Une réponse gardée par le cache heuristique est servie SANS contacter le
    # serveur : aucun en-tête ne peut les libérer. Le seul point de passage qui
    # atteint encore nginx est la redirection de `/`, qui n'est pas mise en
    # cache. On y envoie donc une fois par appareil vers une URL qu'il ne peut
    # pas avoir en cache ; le cookie posé au même moment évite que la
    # redirection reste polluée les fois suivantes.
    map $cookie_idem_fresh $idem_bust {
        default  "?r=__IDEM_RELEASE__";
        "1"      "";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/xml+rss
        application/manifest+json application/wasm
        image/svg+xml
        font/ttf font/otf;

    # Fichiers `.gz` précalculés au build (niveau 9) : meilleure compression
    # que gzip à la volée, et aucun CPU dépensé à chaque requête.
    gzip_static on;

    # `.br` précalculés au build (qualité 11). `brotli on` couvre ce qui n'a pas
    # été précompressé ; `brotli_static on` sert les fichiers précalculés.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_static on;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/xml+rss
        application/manifest+json application/wasm
        image/svg+xml
        font/ttf font/otf;


    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        # La page prérendue (index.html) avant la coquille rendue dans le navigateur.
        index index.html index.csr.html;

        # Les journaux partent sur la sortie du conteneur (liens posés dans
        # l'image) : c'est ce que collecte Alloy pour Grafana.
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;


        # Tous les en-têtes sont posés ICI, au niveau du serveur, et nulle part
        # ailleurs : un `add_header` dans un `location` annule TOUS ceux hérités
        # du serveur. C'est ce piège qui faisait perdre les en-têtes de sécurité
        # sur les assets.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control $idem_cc_final always;

        # Routes EN
        location /en/ {
            # Chaque route est prérendue dans <route>/index.html : c'est ce HTML,
            # complet (titre, canonique, balises de partage, JSON-LD), que les
            # robots doivent recevoir. La coquille CSR n'est qu'un dernier recours.
            try_files $uri/index.html $uri /en/index.csr.html;
        }

        location /en {
            return 301 /en/;
        }

        # Routes FR
        location /fr/ {
            try_files $uri/index.html $uri /fr/index.csr.html;
        }

        location /fr {
            return 301 /fr/;
        }

        # Redirection de la racine avec détection de la langue
        location = / {
            # `Vary` : sans lui, un cache intermédiaire figerait une langue pour
            # tout le monde. `no-store` : la redirection doit toujours être
            # rejouée, c'est elle qui porte la sortie forcée ci-dessus.
            add_header Vary "Accept-Language, Cookie" always;
            add_header Cache-Control "no-store" always;
            add_header Set-Cookie "idem_fresh=1; Path=/; Max-Age=31536000; SameSite=Lax" always;

            # 1. Vérifier le cookie de langue
            if ($cookie_idem_lang = "fr") {
                return 302 /fr/$idem_bust;
            }
            if ($cookie_idem_lang = "en") {
                return 302 /en/$idem_bust;
            }

            # 2. Détecter la langue préférée via l'en-tête Accept-Language
            if ($http_accept_language ~* "^fr") {
                return 302 /fr/$idem_bust;
            }
            if ($http_accept_language ~* "^en") {
                return 302 /en/$idem_bust;
            }

            # 3. Langue par défaut
            return 302 /en/$idem_bust;
        }

        # Route par défaut FR - Fallback DIRECT (pas de $uri/)

        # Images : servir le `.webp` fabriqué au build quand le navigateur
        # l'accepte, sinon l'original. `Vary: Accept` est indispensable — sans
        # lui, un cache intermédiaire servirait du WebP à un navigateur qui
        # n'en veut pas.
        #
        # Les en-têtes du serveur sont répétés ici : un `add_header` dans un
        # `location` annule tous ceux hérités.
        location ~* ^/assets/.+\.(png|jpe?g)$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Cache-Control $idem_cc_final always;
            add_header Vary "Accept" always;
            try_files $uri$idem_webp $uri =404;
        }


        # Un fichier statique absent doit répondre 404, pas la coquille HTML.
        # Sinon un morceau de code supprimé par un déploiement renvoie du HTML
        # avec un code 200 : le navigateur échoue à l'analyser comme module, et
        # la détection de « nouvelle version » ne voit pas d'erreur franche.
        location ~* \.(js|mjs|css|map|woff2|woff|ttf|otf|eot|wasm|webmanifest)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/index.html /index.csr.html /index.html;
        }

        # Gérer les erreurs 404 proprement
        error_page 404 /index.csr.html;

        # Désactiver les logs pour favicon et robots
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            try_files $uri =204;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
            try_files $uri =204;
        }
    }
}
