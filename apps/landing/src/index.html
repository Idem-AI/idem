<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <script>
      // No-flash theme boot: apply the shared `idem_theme` cookie (or the browser
      // preference) before first paint. Keep in sync with theme-cookie.ts.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)idem_theme=([^;]+)/);
          var pref = m ? decodeURIComponent(m[1]) : null;
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.toggle('dark', dark);
          el.classList.toggle('light', !dark);
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script>
      (function() {
        // Shared cross-app locale cookie: `idem_lang` on `.idem.africa` in prod
        // (shared across sub-domains), host-only on localhost. Keep this contract
        // identical to shared/utils/locale-cookie.ts and the other Idem apps.
        var host = window.location.hostname;
        var onIdem = host.indexOf('idem.africa') !== -1 &&
          host.lastIndexOf('idem.africa') === host.length - 'idem.africa'.length;
        function getCookie(name) {
          var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]+)'));
          return m ? decodeURIComponent(m[1]) : null;
        }
        function saveLang(lang) {
          localStorage.setItem('idem_lang', lang);
          var scope = onIdem ? '; domain=.idem.africa; Secure' : '';
          document.cookie = 'idem_lang=' + lang + '; path=/; max-age=31536000; SameSite=Lax' + scope;
        }

        var pathname = window.location.pathname;
        var hasFr = pathname.startsWith('/fr/') || pathname === '/fr';
        var hasEn = pathname.startsWith('/en/') || pathname === '/en';

        if (hasFr) {
          saveLang('fr');
        } else if (hasEn) {
          saveLang('en');
        } else {
          // Skip redirection on local development servers
          if (host !== 'localhost' && host !== '127.0.0.1') {
            // Priority: shared cookie (set by any Idem app) > localStorage > browser.
            var pref = getCookie('idem_lang') || localStorage.getItem('idem_lang');
            if (pref !== 'fr' && pref !== 'en') {
              var userLang = navigator.language || navigator.userLanguage || '';
              pref = userLang.toLowerCase().startsWith('fr') ? 'fr' : 'en';
            }
            saveLang(pref);

            var newPath = '/' + pref + (pathname.startsWith('/') ? pathname : '/' + pathname);
            window.location.replace(newPath);
          }
        }
      })();
    </script>
    <title i18n="@@seo.home.title">IDEM — The AI that builds profitable businesses</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
