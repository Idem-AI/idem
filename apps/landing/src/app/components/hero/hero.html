<!-- Le héros : le titre, puis IDEM lui-même dans une fenêtre. Le film qui joue
     dedans est fait des écrans réels d'un projet (Turo) : charte, business
     plan, vidéo, visuels, site, mise en ligne. Les chapitres à gauche suivent
     le film et permettent d'y sauter. -->
<section class="hero" aria-labelledby="hero-title">
  <div class="hero-head">
    <h1 id="hero-title" class="hero-title font-black flex flex-col" i18n="@@hero.title">
      <span class="">The AI that builds </span>

      <span class=""
        ><span class="i-underline whitespace-nowrap">profitable businesses</span></span
      >
    </h1>

    <p class="hero-lede" i18n="@@hero.description">
      <span class="font-black text-primary-500">More than 500 AI agents</span> to structure your
      project, manage your finances, create your brand, your communication strategy and your
      website, and deploy it in Africa.
    </p>
  </div>

  <figure class="demo">
    <div class="demo-window">
      <div class="demo-bar">
        <span class="demo-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <p class="demo-crumb">
          <span class="demo-crumb-project">Turo</span>
          <span class="demo-crumb-sep" aria-hidden="true">/</span>
          <span class="demo-crumb-page">{{ chapters[active()].label }}</span>
        </p>
      </div>

      <div class="demo-body">
        <nav class="demo-side" i18n-aria-label="@@hero.demo.chapters" aria-label="What IDEM produced for Turo">
          <p class="demo-project">
            <span class="status-dot bg-primary-500" aria-hidden="true"></span>
            <span>Turo</span>
          </p>
          <ol class="demo-list">
            @for (chapter of chapters; track chapter.id; let i = $index) {
              <li>
                <button
                  type="button"
                  class="demo-item"
                  [class.is-active]="active() === i"
                  [attr.aria-current]="active() === i ? 'step' : null"
                  (click)="seek(i)"
                >
                  <i class="pi {{ chapter.icon }}" aria-hidden="true"></i>
                  <span>{{ chapter.label }}</span>
                  <span class="demo-item-progress" aria-hidden="true"></span>
                </button>
              </li>
            }
          </ol>
        </nav>

        <div class="demo-stage">
          <video
            #film
            class="demo-film"
            autoplay
            muted
            playsinline
            loop
            preload="auto"
            poster="assets/videos/idem-demo-poster.webp"
            width="1280"
            height="720"
            i18n-aria-label="@@hero.demo.film"
            aria-label="IDEM at work on Turo: brand guidelines, business plan, promo video, social visuals, website, then the site put online at myapp.com"
          >
            <!-- AV1 1280x720 (528 Ko) là où il se lit, H.264 854x480 (667 Ko) partout ailleurs. -->
            <source src="assets/videos/idem-demo.av1.mp4" type="video/mp4; codecs=av01.0.05M.08" />
            <source src="assets/videos/idem-demo.mp4" type="video/mp4" />
          </video>

          <button
            type="button"
            class="button-icon demo-toggle"
            (click)="togglePlay()"
            [attr.aria-label]="playing() ? pauseLabel : playLabel"
          >
            <i class="pi" [class.pi-pause]="playing()" [class.pi-play]="!playing()" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
  </figure>

</section>
