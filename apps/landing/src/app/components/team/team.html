<!-- Les fondateurs. Deux personnes réelles : leurs portraits restent des
     photographies. Pas de carte autour de chaque visage, pas de centrage —
     la rangée et le filet suffisent. -->
<div class="ed-section ed-wrap">
  <div class="grid gap-12 lg:grid-cols-12 lg:gap-16">
    <div class="lg:col-span-4">
      <h2 class="ed-h2" i18n="@@team.title">Who you are talking to</h2>
      <p class="ed-body ed-mt-6" i18n="@@team.body">
        IDEM has two co-founders. Both are engineers, both are Cameroonian, and both answer their
        own email.
      </p>
    </div>

    <ul class="lg:col-span-8 ed-rows ed-rows-closed">
      @for (founder of founders; track founder.name) {
        <li class="ed-row grid gap-6 sm:grid-cols-[8rem_1fr] sm:gap-8 sm:items-start">
          <img
            class="tm-portrait"
            [ngSrc]="founder.photo"
            width="192"
            height="192"
            [alt]="founder.name"
          />
          <div>
            <h3 class="ed-h3">{{ founder.name }}</h3>
            <p class="tm-role">{{ founder.role }}</p>
            <p class="ed-body ed-mt-3">{{ founder.bio }}</p>
          </div>
        </li>
      }
    </ul>
  </div>
</div>
