<!-- L'appel final de l'accueil.
     Le texte et IDEO forment un couple centré dans la page, et non deux blocs
     repoussés chacun contre son bord. Rien n'encadre IDEO — le PNG est
     détouré, donc lui remettre un panneau, une ombre ou un fond redessinerait
     le rectangle que le détourage a retiré. Rien n'attend un défilement pour
     apparaître. -->
<section class="cta-band">
  <div class="ed-wrap cta-stage">
    <!-- Titre, texte et actions dans un seul bloc : séparés en éléments de
         grille distincts, ils se faisaient étirer par la hauteur d'IDEO et un
         trou s'ouvrait sous le titre. -->
    <div class="cta-text">
      <h2 class="cta-title">
        <span i18n="@@cta.title.lead">It starts with</span><br />
        <span class="i-underline" i18n="@@cta.title.accent">one description</span>
      </h2>

      <p class="ed-lede ed-lede-wide ed-mt-8" i18n="@@cta.lede">
        Say what your business does, in a few lines. IDEM draws the brand, writes the plan, builds
        the site and puts it online. Seeing what it produces costs nothing.
      </p>

      <div class="ed-mt-10 flex flex-col gap-3 sm:flex-row">
        <a class="inner-button" href="{{ dashboardUrl }}/create-project">
          <ng-container i18n="@@cta.start">Create a project</ng-container>
        </a>
        <a class="outer-button" routerLink="/pricing">
          <ng-container i18n="@@cta.pricing">See the prices</ng-container>
        </a>
      </div>
    </div>

    <figure class="cta-figure">
      <img
        src="assets/images/home/ideo.png"
        i18n-alt="@@cta.alt.ideo"
        alt="IDEO, the IDEM mascot, giving a thumbs up"
        width="1024"
        height="1536"
        loading="lazy"
        decoding="async"
      />
    </figure>
  </div>
</section>
