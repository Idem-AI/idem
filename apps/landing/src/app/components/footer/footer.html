<!-- Le pied de page partagé par toutes les applications IDEM. Seules la
     bascule de langue et celle de thème sont propres à la landing : elles
     agissent sur elle, donc elles vivent en elle, et sont projetées dans la
     zone de préférences de la ligne de signature. -->
<idem-footer
  app="idem"
  [locale]="footerLocale()"
  [services]="services"
  [selfHosted]="true"
  logoLight="/assets/icons/logo_white.png"
  logoDark="/assets/icons/logo_dark.png"
  logoAlt="IDEM"
  i18n-navLabel="@@footer.aria.nav"
  navLabel="Footer navigation"
>
  <div class="ft-lang" role="group" i18n-aria-label="@@footer.aria.language" aria-label="Language">
    <button
      type="button"
      (click)="switchLanguage('en')"
      [class.is-active]="locale === 'en'"
      [attr.aria-pressed]="locale === 'en'"
      class="ft-lang-btn"
    >
      EN
    </button>
    <button
      type="button"
      (click)="switchLanguage('fr')"
      [class.is-active]="locale === 'fr'"
      [attr.aria-pressed]="locale === 'fr'"
      class="ft-lang-btn"
    >
      FR
    </button>
  </div>
  <app-theme-toggle />
</idem-footer>
