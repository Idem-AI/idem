<!-- Main container with animated gradient background.
     overflow-clip (not overflow-hidden): clipping without creating a scroll
     container, so the journey section's sticky pinning keeps working. -->
<div class="relative mt-24 sm:mt-0 min-h-screen overflow-clip bg-grid">
  <!-- Content container -->
  <div class="relative">
    <!-- Hero -->
    <section class="relative">
      <app-hero></app-hero>
    </section>

    <!-- Product in action (video) -->
    <section class="relative z-10">
      <app-video-trailer></app-video-trailer>
    </section>

    <!-- What is IDEM: the promise, told as an illustrated journey -->
    <section class="relative z-10">
      <app-journey></app-journey>
    </section>

    <!-- Les offres, par besoin (même bloc que la page Tarifs) -->
    <section class="relative z-10 border-y border-[var(--glass-border-subtle)] py-24 lg:py-32">
      <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
        <app-offer-picker [summary]="true" />
      </div>
    </section>

    <!-- Technology & sovereignty: the ambition -->
    <section class="relative z-10">
      <app-technology-sovereignty></app-technology-sovereignty>
    </section>

    <!-- Premium beta programme: try every plan free while the beta lasts -->
    <section class="relative z-10">
      <app-beta-program></app-beta-program>
    </section>

    <!-- Final call to action -->
    <app-cta></app-cta>
  </div>
</div>
