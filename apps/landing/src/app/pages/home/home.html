<!-- Main container with animated gradient background.
     overflow-clip (not overflow-hidden): clipping without creating a scroll
     container, so the journey section's sticky pinning keeps working. -->
<div class="relative min-h-screen overflow-clip bg-grid">
  <!-- Content container -->
  <div class="relative">
    <!-- Hero -->
    <section class="relative">
      <app-hero></app-hero>
    </section>

    <!-- What is IDEM: the promise, told as an illustrated journey -->
    <section class="relative z-10">
      @defer (hydrate on viewport) {
        <app-journey></app-journey>
      }
    </section>

    <!-- Les offres, par besoin (même bloc que la page Tarifs) -->
    <section class="relative z-10 border-y border-[var(--glass-border-subtle)] py-14 lg:py-20">
      <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
        @defer (hydrate on viewport) {
          <app-offer-picker [summary]="true" />
        }
      </div>
    </section>

    <!-- Payer par mobile money, sans abonnement (même section que sur toutes les landings) -->
    <section class="relative z-10 py-10 lg:py-14">
      <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
        @defer (hydrate on viewport) {
          <idem-pay-section [ctaHref]="startUrl" />
        }
      </div>
    </section>

    <!-- Premium beta programme: try every plan free while the beta lasts -->
    <section class="relative z-10">
      @defer (hydrate on viewport) {
        <app-beta-program></app-beta-program>
      }
    </section>

    <!-- Idem Builders : les projets africains gérés avec IDEM, mis en avant -->
    <section class="relative z-10">
      @defer (hydrate on viewport) {
        <app-builders-program></app-builders-program>
      }
    </section>

    <!-- Final call to action -->
    @defer (hydrate on viewport) {
      <app-cta></app-cta>
    }
  </div>
</div>
