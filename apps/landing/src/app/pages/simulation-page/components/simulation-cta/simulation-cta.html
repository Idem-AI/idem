<!-- L'appel final. La photographie sous voile noir et dégradé est retirée :
     elle imposait une surface sombre dans une page claire (AGENTS.md § 3) et
     obligeait à écrire les boutons en blanc à la main. La daba dit ce que fait
     une simulation : aller retourner la terre avant de semer. -->
<section class="ed-section ed-wrap ed-rule">
  <div class="grid gap-14 lg:grid-cols-12 lg:gap-16 lg:items-center">
    <div class="lg:col-span-6">
      <!-- `ed-h2` et non `ed-display` : le corps de titre de page déborde d'une
           demi-colonne dès qu'un mot y est un peu long. -->
      <h2 class="ed-h2" i18n="@@simulation.cta.title">Put your project under strain</h2>
      <p class="ed-lede ed-lede-wide ed-mt-10" i18n="@@simulation.cta.body">
        Before you commit your time and your money, find out under what conditions your business can
        work and what could make it fail.
      </p>
      <div class="ed-mt-10 flex flex-col gap-3 sm:flex-row">
        <a [href]="simulationUrl" class="inner-button">
          <ng-container i18n="@@simulation.cta.primary">Run a simulation</ng-container>
        </a>
        <a routerLink="/pricing" class="outer-button">
          <ng-container i18n="@@simulation.cta.secondary">See IDEM pricing</ng-container>
        </a>
      </div>
    </div>

    <div class="lg:col-span-6">
      <figure class="ed-art ed-art-fill mx-auto lg:mx-0">
        <app-page-art scene="daba" />
      </figure>
    </div>
  </div>
</section>
