<section class="px-4 pb-24 sm:px-6 lg:pb-32">
  <div class="relative mx-auto max-w-7xl overflow-hidden rounded-[2rem] border border-[var(--glass-border)]">
    <img
      ngSrc="/assets/images/pricing-page/business-success.webp"
      fill
      sizes="100vw"
      i18n-alt="@@simulation.cta.image.alt"
      alt="Entrepreneurs going ahead with a project they have tested"
      class="object-cover"
    />
    <div class="absolute inset-0 bg-linear-to-br from-black/90 via-black/75 to-primary/50" aria-hidden="true"></div>

    <div class="relative px-6 py-20 text-center sm:px-10 lg:py-28">
      <h2 class="mx-auto max-w-2xl text-3xl font-bold leading-tight text-balance text-white sm:text-4xl lg:text-5xl" i18n="@@simulation.cta.title">
        Put your project under strain
      </h2>
      <p class="mx-auto mt-5 max-w-xl text-lg leading-relaxed text-pretty text-white/75" i18n="@@simulation.cta.body">
        Before you commit your time and your money, find out under what conditions your business can work and what could make it fail.
      </p>
      <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
        <a [href]="simulationUrl" class="inner-button rounded-xl px-8 py-4 text-center text-lg font-semibold">
          <span i18n="@@simulation.cta.primary">Run a simulation</span>
        </a>
        <a routerLink="/pricing" class="rounded-xl border border-white/30 bg-white/10 px-8 py-4 text-center text-lg font-semibold uppercase text-white backdrop-blur-sm transition-colors hover:bg-white/20">
          <span i18n="@@simulation.cta.secondary">See IDEM pricing</span>
        </a>
      </div>
    </div>
  </div>
</section>
