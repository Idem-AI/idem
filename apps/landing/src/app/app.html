<!-- Motif background for all pages -->
<div class="fixed inset-0 z-[-1] pointer-events-none opacity-[calc(0.1*var(--idem-motif-strength))] dark:invert dark:opacity-[calc(0.15*var(--idem-motif-strength))]" style="background-image: url('/assets/images/motif.png'); background-repeat: repeat; background-position: top left;"></div>

@if (isInitialLoading()) {
  <app-splash-screen></app-splash-screen>
}

<app-header />
<router-outlet (activate)="resetPosition()"></router-outlet>
<app-footer />
