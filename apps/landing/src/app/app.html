<!-- Motif background for all pages -->
<div class="fixed inset-0 z-[-1] pointer-events-none opacity-[calc(0.1*var(--idem-motif-strength))] dark:invert dark:opacity-[calc(0.15*var(--idem-motif-strength))]" style="background-image: url('/assets/images/motif.png'); background-repeat: repeat; background-position: top left;"></div>

<app-header />
<router-outlet (activate)="resetPosition()"></router-outlet>
<app-footer />

<!-- L'arc fixe et son bouton, sur toutes les pages ; les partenaires sur l'accueil seulement. -->
<app-dock [trust]="isHome()" />

<!--
  « Une nouvelle version est disponible. » Le service worker sert la page
  depuis le cache pour qu'elle s'affiche tout de suite, même à bas débit.
  Les textes sont traduits par `$localize` : la landing est compilée une fois
  par locale (/fr et /en), elle n'a pas de chargeur de traductions.
-->
<idem-update-banner
  [label]="updateLabel"
  [actionLabel]="updateAction"
  [dismissLabel]="updateDismiss"
/>
