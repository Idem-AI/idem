load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;
user nginx;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;

    # ------------------------------------------------------------------
    # Politique de cache (identique dans les six applications IDEM)
    # ------------------------------------------------------------------
    # Pilotée par le type de contenu et non par l'extension de l'URL, pour
    # qu'aucune page HTML ne puisse repartir sans en-tête : sans
    # `Cache-Control`, les navigateurs appliquent leur cache heuristique et
    # gardent des semaines une coquille périmée, qui pointe vers des fichiers
    # hachés qu'un déploiement ultérieur a supprimés.
    map $uri $idem_uri_cc {
        default "";

        # Le service worker décide des mises à jour : le mettre en cache
        # reviendrait à geler l'application sur une version.
        "~*^/(?:sw|ngsw-worker|safety-worker)\.js$"  "no-cache, no-store, must-revalidate";
        "~*^/ngsw\.json$"                            "no-cache, no-store, must-revalidate";

        # Les traductions gardent le même nom d'un déploiement à l'autre :
        # en `immutable`, les nouveaux textes n'arrivaient jamais sur un
        # appareil déjà venu.
        "~*^/assets/i18n/"                           "no-cache";

        # Empreinte de build (`main-XBVKFCF2.js`) et dossier `media/`
        # (polices) : contenu adressé par son nom, figé à vie.
        "~*-[A-Za-z0-9_-]{8,}\.(?:js|mjs|css|woff2|woff|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|avif|wasm)$"  "public, max-age=31536000, immutable";
        "~*^/media/"                                 "public, max-age=31536000, immutable";
    }

    map $sent_http_content_type $idem_type_cc {
        # Assets non hachés (images de `public/assets`) : une semaine, puis
        # revalidation — et réutilisation pendant la revalidation.
        default                         "public, max-age=604800, stale-while-revalidate=86400";
        "~*^text/html"                  "no-cache, must-revalidate";
        "~*^application/json"           "no-cache";
        "~*^application/manifest\+json" "no-cache";
        "~*^text/xml"                   "no-cache";
        "~*^application/xml"            "no-cache";
    }

    # Négociation de contenu pour les images.
    #
    # Les PNG/JPEG de `public/assets` pèsent lourd (19 Mo sur iDeploy, 6,7 Mo
    # sur le tableau de bord) et ne sont ni redimensionnés ni convertis. Plutôt
    # que de renommer des centaines de références dans les gabarits — au risque
    # d'en oublier — le build fabrique un `.webp` à côté de chaque image et
    # nginx le sert aux navigateurs qui l'acceptent. Les autres reçoivent
    # l'original : rien ne casse, et l'URL ne change pas.
    map $http_accept $idem_webp {
        default        "";
        "~*image/webp" ".webp";
    }

    map $idem_uri_cc $idem_cache_control {
        ""      $idem_type_cc;
        default $idem_uri_cc;
    }

    # Une erreur ne se met jamais en cache. Sans cette carte, un 404 passager
    # pendant un déploiement repartait avec `immutable` : le navigateur aurait
    # gardé l'absence du fichier pendant un an.
    map $status $idem_cc_final {
        default   $idem_cache_control;
        "~^[45]"  "no-store";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/xml+rss
        application/manifest+json application/wasm
        image/svg+xml
        font/ttf font/otf;

    # Fichiers `.gz` précalculés au build (niveau 9) : meilleure compression
    # que gzip à la volée, et aucun CPU dépensé à chaque requête.
    gzip_static on;

    # Brotli, précompressé au build (voir le Dockerfile).
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 256;
    brotli_static on;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/xml+rss
        application/manifest+json application/wasm
        image/svg+xml
        font/ttf font/otf;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # Tous les en-têtes sont posés ICI, au niveau du serveur, et nulle part
        # ailleurs : un `add_header` dans un `location` annule TOUS ceux hérités
        # du serveur. C'est ce piège qui faisait perdre les en-têtes de sécurité
        # sur les assets.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control $idem_cc_final always;


        # Images : servir le `.webp` fabriqué au build quand le navigateur
        # l'accepte, sinon l'original. `Vary: Accept` est indispensable — sans
        # lui, un cache intermédiaire servirait du WebP à un navigateur qui
        # n'en veut pas.
        #
        # Les en-têtes du serveur sont répétés ici : un `add_header` dans un
        # `location` annule tous ceux hérités.
        location ~* ^/assets/.+\.(png|jpe?g)$ {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Cache-Control $idem_cc_final always;
            add_header Vary "Accept" always;
            try_files $uri$idem_webp $uri =404;
        }


        # Un fichier statique absent doit répondre 404, pas la coquille HTML.
        # Sinon un morceau de code supprimé par un déploiement renvoie du HTML
        # avec un code 200 : le navigateur échoue à l'analyser comme module, et
        # la détection de « nouvelle version » ne voit pas d'erreur franche.
        location ~* \.(js|mjs|css|map|woff2|woff|ttf|otf|eot|wasm|webmanifest)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }
    }
}
