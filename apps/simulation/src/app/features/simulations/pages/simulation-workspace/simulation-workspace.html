@if (simulation(); as run) {
  <div class="flex flex-col gap-6">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <a routerLink="/simulations" class="sim-link">
        <i class="pi pi-arrow-left text-xs" aria-hidden="true"></i>
        {{ 'nav.simulations' | translate }}
      </a>

      @if (isRunning()) {
        <p class="sim-pill sim-pill--info" aria-live="polite">
          <span class="size-2 animate-pulse rounded-full bg-current" aria-hidden="true"></span>
          {{ 'run.inProgress' | translate: { percent: run.progress.percent } }}
        </p>
      }
    </div>

    <router-outlet />
  </div>
} @else if (status() === 'error') {
  <div class="glass-card" role="alert">
    <sim-empty-state
      illustration="calabash-cracked"
      [heading]="'error.loadFailed' | translate"
      [body]="'error.loadFailedBody' | translate"
    >
      <a routerLink="/simulations" class="outer-button">{{ 'nav.simulations' | translate }}</a>
    </sim-empty-state>
  </div>
} @else {
  <div class="flex flex-col gap-4" aria-hidden="true">
    <div class="skeleton h-6 w-40 rounded"></div>
    <div class="skeleton h-72 rounded-2xl"></div>
    <div class="skeleton h-40 rounded-2xl"></div>
  </div>
}
