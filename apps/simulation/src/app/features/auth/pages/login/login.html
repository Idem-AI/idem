<div class="flex min-h-dvh flex-col">
  <div class="flex items-center justify-end gap-1 p-4">
    <sim-theme-toggle />
    <sim-language-menu />
  </div>

  <main id="sim-main" class="mx-auto flex w-full max-w-sm flex-1 flex-col justify-center px-6 pb-16">
    <div class="mb-8">
      <span class="grid size-9 place-items-center rounded-xl bg-brand text-brand-ink" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19V9m5 10V5m5 14v-7m5 7V8" stroke-linecap="round" />
        </svg>
      </span>
      <h1 class="mt-5 text-h1 font-semibold text-ink">{{ 'auth.heading' | translate }}</h1>
      <p class="mt-2 text-sm leading-relaxed text-ink-muted">{{ 'auth.subheading' | translate }}</p>
    </div>

    @if (errorMessage()) {
      <p
        class="mb-4 rounded-lg border border-verdict-stop/40 bg-panel-sunken px-3 py-2.5 text-sm text-ink"
        role="alert"
      >
        {{ errorMessage() }}
      </p>
    }

    <div class="flex flex-col gap-2">
      <button
        type="button"
        class="outer-button button-lg w-full"
        [disabled]="pending() !== null"
        (click)="signInWith('google')"
      >
        <svg viewBox="0 0 24 24" class="size-4.5" aria-hidden="true">
          <path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.6Z" />
          <path fill="#34A853" d="M12 24c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3a12 12 0 0 0 10.2 6.3Z" />
          <path fill="#FBBC05" d="M5.6 14.7a7.2 7.2 0 0 1 0-4.6v-3H1.8a12 12 0 0 0 0 10.6l3.8-3Z" />
          <path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3A11.6 11.6 0 0 0 12 0 12 12 0 0 0 1.8 6.1l3.8 3c.9-2.8 3.4-4.7 6.4-4.7Z" />
        </svg>
        {{ 'auth.continueWithGoogle' | translate }}
      </button>

      <button
        type="button"
        class="outer-button button-lg w-full"
        [disabled]="pending() !== null"
        (click)="signInWith('github')"
      >
        <svg viewBox="0 0 24 24" class="size-4.5" fill="currentColor" aria-hidden="true">
          <path d="M12 .5A11.5 11.5 0 0 0 8.4 22.9c.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.4-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.8 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.8 1.2 3.1 0 4.5-2.7 5.5-5.3 5.8.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .5Z" />
        </svg>
        {{ 'auth.continueWithGithub' | translate }}
      </button>
    </div>

    <div class="my-6 flex items-center gap-3">
      <hr class="sim-divider flex-1" />
      <span class="text-meta uppercase tracking-wider text-ink-subtle">{{ 'auth.or' | translate }}</span>
      <hr class="sim-divider flex-1" />
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3" novalidate>
      <div>
        <label for="email" class="mb-1.5 block text-label font-medium text-ink-muted">
          {{ 'auth.email' | translate }}
        </label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          class="field"
          formControlName="email"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-label font-medium text-ink-muted">
          {{ 'auth.password' | translate }}
        </label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          class="field"
          formControlName="password"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
      </div>

      <button type="submit" class="inner-button button-lg mt-1 w-full" [disabled]="pending() !== null">
        @if (pending() === 'email') {
          {{ 'auth.signingIn' | translate }}
        } @else {
          {{ 'auth.signIn' | translate }}
        }
      </button>
    </form>

    <p class="mt-6 text-meta leading-relaxed text-ink-subtle">
      {{ 'auth.sharedAccountNote' | translate }}
      <a [href]="landingUrl" class="text-brand underline underline-offset-2">idem.africa</a>
    </p>
  </main>
</div>
