<div class="min-h-dvh">
  <sim-topbar
    [navToggleVisible]="true"
    [projectPickerVisible]="true"
    [navCollapsed]="collapsed()"
    (navToggle)="toggleNav()"
  />

  <!-- Colonne de navigation -->
  <aside
    class="glass fixed bottom-0 left-0 top-16 z-30 hidden border-r border-line transition-[width] duration-300 md:block"
    [class.w-64]="!collapsed()"
    [class.w-20]="collapsed()"
  >
    <sim-sidebar [simulationId]="simulationId()" [collapsed]="collapsed()" />
  </aside>

  <!-- Tiroir mobile -->
  @if (drawerOpen()) {
    <div class="fixed inset-0 z-50 md:hidden">
      <button
        type="button"
        class="absolute inset-0 h-full w-full bg-black/60 backdrop-blur-sm"
        [attr.aria-label]="'nav.closeMenu' | translate"
        (click)="drawerOpen.set(false)"
      ></button>
      <div class="glass absolute bottom-0 left-0 top-0 w-72 border-r border-line shadow-raised">
        <sim-sidebar
          [simulationId]="simulationId()"
          [inDrawer]="true"
          (navigate)="drawerOpen.set(false)"
        />
      </div>
    </div>
  }

  <div
    class="pt-16 transition-[margin] duration-300"
    [class.md:ml-64]="!collapsed()"
    [class.md:ml-20]="collapsed()"
  >
    <main id="sim-main" class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:py-8">
      <router-outlet />
    </main>
  </div>
</div>
