    <script>
      // Resolve the theme before first paint so the app never flashes the
      // wrong background. Same source as ThemeService: the `idem_theme`
      // cookie shared by every IDEM app, then the former local key.
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)idem_theme=([^;]+)/);
          var stored = m ? decodeURIComponent(m[1]) : null;
          if (stored !== 'light' && stored !== 'dark' && stored !== 'system') {
            stored = localStorage.getItem('idem_simulation_theme');
          }
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.classList.toggle('light', theme === 'light');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
        try {
          var lang = localStorage.getItem('idem_simulation_language');
          if (lang === 'fr' || lang === 'en') document.documentElement.lang = lang;
        } catch (e) {
          /* storage unavailable: keep the markup default */
        }
      })();
    </script>
