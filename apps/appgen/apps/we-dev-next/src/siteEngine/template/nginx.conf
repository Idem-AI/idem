server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression : le texte (HTML, CSS, JS, SVG, JSON, XML) part compressé, ~70 % plus léger.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml font/ttf font/otf;

  # Sécurité de base, sans rien casser : pas de type deviné, référent réduit, capteurs fermés.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Site multi-pages : chaque page est un dossier avec son index.html. Toujours revalidé : une mise à jour se voit
  # tout de suite.
  location / {
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Fichiers dont le nom porte l'empreinte du contenu (Vite : `index-B1x2y3z4.js`, polices : `font-<empreinte>.woff2`) :
  # ils ne changent jamais, gardés un an.
  location ~* /assets/.+\.(js|css|woff2?|ttf|otf|svg|png|jpe?g|webp|avif|gif)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Les autres fichiers (images de public/, icônes) peuvent changer sous le même nom : une semaine, puis revalidés.
  location ~* \.(svg|png|jpe?g|webp|avif|gif|ico|woff2?|mp4|webm)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
