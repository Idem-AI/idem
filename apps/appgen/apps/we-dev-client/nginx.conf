server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SharedArrayBuffer requis par certains workers et modules WASM.
  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/manifest+json application/wasm
    image/svg+xml font/ttf font/otf;

  gzip_static on;

  # Fichiers statiques absents → 404 strict (pas de fallback HTML).
  location ~* \.(js|mjs|css|map|woff2?|ttf|otf|wasm|webmanifest)$ {
    try_files $uri =404;
  }

  # Assets hachés par Vite : immuables un an.
  location ~* /assets/.+\.(js|mjs|css|woff2?|ttf|otf|svg|png|jpe?g|webp|avif|gif|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SPA — toute route inconnue renvoie l'enveloppe React.
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }
}
