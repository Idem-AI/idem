    <!-- Le thème est posé avant le premier rendu : sans cela, une page sombre
         s'affiche en clair pendant une frame (flash blanc) le temps que React
         monte et que `useInit` lise le cookie. -->
    <script>
      (function () {
        try {
          var cookie = document.cookie.match(/(?:^|;\s*)idem_theme=([^;]*)/);
          var stored = cookie ? decodeURIComponent(cookie[1]) : localStorage.getItem('theme');
          var isDark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(isDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
