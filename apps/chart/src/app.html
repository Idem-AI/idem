<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online FlowChart &amp; Diagrams Editor - Mermaid Live Editor</title>
    <meta
      name="og:image"
      content="https://github.com/mermaid-js/mermaid/raw/develop/img/header.png" />
    <link rel="canonical" href="https://mermaid.live" />
    <meta
      name="description"
      content="Simplify documentation and avoid heavy tools. Open source Visio Alternative. Commonly used for explaining your code! Mermaid is a simple markdown-like script language for generating charts from text via javascript." />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.svg" />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#000000" />
    <meta name="theme-color" content="#6366F1" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    %sveltekit.head%
  </head>
  <body>
    <!-- Global initial loader - shown before Svelte hydrates -->
    <div
      id="initial-loader"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: hsl(222.2 84% 4.9%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      ">
      <div
        style="
          text-align: center;
          color: hsl(210 40% 98%);
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 1rem;
        ">
        <!-- Le semis d'awalé de @idem/shared-loader (taille lg), en SVG statique :
             Svelte n'a pas encore démarré, le composant n'existe pas encore. -->
        <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="idem-boot-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="48" y2="48">
              <stop offset="0%" stop-color="#1447e6" />
              <stop offset="100%" stop-color="#22d3ee" />
            </linearGradient>
          </defs>
          <g fill="url(#idem-boot-gradient)">
          <path class="idem-boot-seed" style="animation-delay: -1200ms" d="M24.00 3.50 L27.50 8.00 L24.00 12.50 L20.50 8.00Z" />
          <path class="idem-boot-seed" style="animation-delay: -1050ms" d="M38.50 9.50 L37.79 15.16 L32.13 15.87 L32.84 10.21Z" />
          <path class="idem-boot-seed" style="animation-delay: -900ms" d="M44.50 24.00 L40.00 27.50 L35.50 24.00 L40.00 20.50Z" />
          <path class="idem-boot-seed" style="animation-delay: -750ms" d="M38.50 38.50 L32.84 37.79 L32.13 32.13 L37.79 32.84Z" />
          <path class="idem-boot-seed" style="animation-delay: -600ms" d="M24.00 44.50 L20.50 40.00 L24.00 35.50 L27.50 40.00Z" />
          <path class="idem-boot-seed" style="animation-delay: -450ms" d="M9.50 38.50 L10.21 32.84 L15.87 32.13 L15.16 37.79Z" />
          <path class="idem-boot-seed" style="animation-delay: -300ms" d="M3.50 24.00 L8.00 20.50 L12.50 24.00 L8.00 27.50Z" />
          <path class="idem-boot-seed" style="animation-delay: -150ms" d="M9.50 9.50 L15.16 10.21 L15.87 15.87 L10.21 15.16Z" />
          </g>
        </svg>
        <div style="font-family: 'Vilevile', sans-serif; font-size: 1.1rem; font-weight: 500">
          Loading Idem Chart...
        </div>
      </div>
    </div>

    <style>
      .idem-boot-seed {
        opacity: 0.2;
        animation: idem-boot-sow 1.2s linear infinite;
      }

      @keyframes idem-boot-sow {
        0% {
          opacity: 1;
        }
        70%,
        100% {
          opacity: 0.2;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .idem-boot-seed {
          animation-duration: 3.2s;
          animation-timing-function: steps(1, end);
        }
      }

      /* Light theme support */
      @media (prefers-color-scheme: light) {
        #initial-loader {
          background-color: hsl(0 0% 100%) !important;
          color: hsl(222.2 84% 4.9%) !important;
        }
      }
    </style>

    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
