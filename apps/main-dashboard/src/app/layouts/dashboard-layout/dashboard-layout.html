<!-- Layout container -->
<div class="min-h-screen">
  <!--
    La barre du haut porte les commandes de la barre latérale, qu'elle pilote
    par référence de gabarit plutôt que par un état recopié dans cette
    disposition : le repli et le tiroir mobile appartiennent à la barre
    latérale, et deux copies d'un même booléen finissent par se désaccorder.
  -->
  <app-topbar
    [withSidebar]="true"
    [withProjectSelector]="true"
    (toggleSidebar)="sidebar.toggleSidebar()"
    (openMobileDrawer)="sidebar.toggleMobileDrawer()"
  />

  <app-sidebar-dashboard #sidebar (sidebarCollapsedChange)="onSidebarCollapsedChange($event)" />

  <!-- Main content area -->
  <div
    class="transition-all duration-300 pt-[80px] min-h-screen bg-opacity-95 relative ml-0"
    [class.md:ml-64]="!isSidebarCollapsed()"
    [class.md:ml-20]="isSidebarCollapsed()"
  >
    <div
      class="h-full layout-pad"
      [ngClass]="{
        'p-4': true,
        'md:p-8': true,
      }"
    >
      <div
        class="layout-card relative rounded-xl shadow-xl shadow-primary/5 border border-[var(--glass-border-subtle)] h-full"
        [ngClass]="{
          'p-0': true,
          'md:p-6': true,
          'bg-transparent':true
        }"
      >
        <!-- Fil du parcours assisté : visible uniquement dans le mode Assisté -->
        <app-guided-step-bar />

        <router-outlet></router-outlet>
      </div>
    </div>

    <!--
      Les rappels FLOTTENT en haut au centre, sous la barre du haut : l'étape suivante recommandée (mode Avancé) et
      la campagne en cours (bêta gratuite…). Ils ne repoussent plus le contenu vers le bas ; chacun se ferme.
    -->
    <div class="float-stack" [class.float-stack--collapsed]="isSidebarCollapsed()">
      <app-next-step-bar />
      <idem-promo-banner variant="toast" />
    </div>

    <!-- Les textes juridiques, atteignables sans quitter l'application. -->
    <app-footer />
  </div>
</div>
