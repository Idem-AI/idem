<!-- Layout container -->
<div class="min-h-screen">
  <!--
    La barre du haut porte les commandes de la barre latérale, qu'elle pilote
    par référence de gabarit plutôt que par un état recopié dans cette
    disposition : le repli et le tiroir mobile appartiennent à la barre
    latérale, et deux copies d'un même booléen finissent par se désaccorder.
  -->
  <app-topbar
    [withSidebar]="true"
    [withProjectSelector]="true"
    (toggleSidebar)="sidebar.toggleSidebar()"
    (openMobileDrawer)="sidebar.toggleMobileDrawer()"
  />

  <app-sidebar-dashboard #sidebar (sidebarCollapsedChange)="onSidebarCollapsedChange($event)" />

  <!-- Main content area -->
  <div
    class="transition-all duration-300 pt-[80px] min-h-screen bg-opacity-95 relative ml-0"
    [class.md:ml-64]="!isSidebarCollapsed()"
    [class.md:ml-20]="isSidebarCollapsed()"
  >
    <div
      class="h-full"
      [ngClass]="{
        'p-4': true,
        'md:p-8': true,
      }"
    >
      <div
        class="relative rounded-xl shadow-xl shadow-primary/5 border border-[var(--glass-border-subtle)] h-full"
        [ngClass]="{
          'p-0': true,
          'md:p-6': true,
          'bg-transparent':true
        }"
      >
        <!-- Fil du parcours assisté : visible uniquement dans le mode Assisté -->
        <app-guided-step-bar />

        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
