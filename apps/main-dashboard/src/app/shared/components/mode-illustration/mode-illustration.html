@switch (mode()) {
  @case ('guided') {
    <!-- Mode Assisté : un chemin balisé, une étape faite, une en cours, une verrouillée -->
    <svg
      viewBox="0 0 320 200"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="w-full h-full mode-illu"
      role="img"
      aria-hidden="true"
    >
      <rect x="0.5" y="0.5" width="319" height="199" rx="16" class="illu-frame" />

      <!-- Chemin vertical reliant les étapes -->
      <path d="M56 56 L56 100" class="illu-path-done" stroke-width="2.5" stroke-linecap="round" />
      <path
        d="M56 100 L56 144"
        class="illu-path-todo"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-dasharray="5 7"
      />

      <!-- Étape 1 : terminée -->
      <circle cx="56" cy="56" r="15" class="illu-fill-primary" />
      <path
        d="M50 56 l4.5 4.5 L63 52"
        class="illu-stroke-inverse"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <rect x="86" y="47" width="104" height="8" rx="4" class="illu-bar-strong" />
      <rect x="86" y="62" width="66" height="6" rx="3" class="illu-bar-soft" />

      <!-- Étape 2 : en cours (anneau + halo) -->
      <circle cx="56" cy="100" r="22" class="illu-halo" />
      <circle cx="56" cy="100" r="15" class="illu-ring-primary" stroke-width="2.5" />
      <circle cx="56" cy="100" r="5.5" class="illu-fill-primary" />
      <rect x="86" y="91" width="126" height="8" rx="4" class="illu-bar-strong" />
      <rect x="86" y="106" width="88" height="6" rx="3" class="illu-bar-soft" />

      <!-- Étape 3 : verrouillée -->
      <circle
        cx="56"
        cy="144"
        r="15"
        class="illu-ring-muted"
        stroke-width="2"
        stroke-dasharray="4 5"
      />
      <rect x="50" y="141" width="12" height="9" rx="2" class="illu-fill-muted" />
      <path d="M52.5 141 v-3 a3.5 3.5 0 0 1 7 0 v3" class="illu-stroke-muted" stroke-width="1.8" />
      <rect x="86" y="136" width="86" height="8" rx="4" class="illu-bar-faint" />
      <rect x="86" y="151" width="54" height="6" rx="3" class="illu-bar-faint" />
    </svg>
  }

  @case ('chat') {
    <!-- Mode Chat : un échange, une réponse en cours de rédaction -->
    <svg
      viewBox="0 0 320 200"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="w-full h-full mode-illu"
      role="img"
      aria-hidden="true"
    >
      <rect x="0.5" y="0.5" width="319" height="199" rx="16" class="illu-frame" />

      <!-- Bulle utilisateur (à droite) -->
      <path
        d="M148 36 h128 a12 12 0 0 1 12 12 v28 a12 12 0 0 1 -12 12 h-116 l-16 12 v-12 a12 12 0 0 1 -8 -12 v-28 a12 12 0 0 1 12 -12 z"
        class="illu-fill-primary"
      />
      <rect x="164" y="52" width="96" height="7" rx="3.5" class="illu-bar-inverse" />
      <rect x="164" y="65" width="62" height="7" rx="3.5" class="illu-bar-inverse-soft" />

      <!-- Bulle assistant (à gauche) -->
      <path
        d="M44 104 h132 a12 12 0 0 1 12 12 v30 a12 12 0 0 1 -12 12 h-120 l-14 12 v-12 a12 12 0 0 1 -10 -12 v-30 a12 12 0 0 1 12 -12 z"
        class="illu-fill-surface"
      />
      <rect x="58" y="120" width="104" height="7" rx="3.5" class="illu-bar-strong" />
      <rect x="58" y="133" width="76" height="7" rx="3.5" class="illu-bar-soft" />

      <!-- Indicateur de saisie -->
      <circle cx="62" cy="152" r="3.5" class="illu-fill-primary illu-dot-1" />
      <circle cx="74" cy="152" r="3.5" class="illu-fill-primary illu-dot-2" />
      <circle cx="86" cy="152" r="3.5" class="illu-fill-primary illu-dot-3" />

      <!-- Étincelle IA -->
      <path
        d="M262 118 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"
        class="illu-fill-primary illu-spark"
      />
    </svg>
  }

  @default {
    <!-- Mode Avancé : le tableau de bord complet, tout est accessible -->
    <svg
      viewBox="0 0 320 200"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="w-full h-full mode-illu"
      role="img"
      aria-hidden="true"
    >
      <rect x="0.5" y="0.5" width="319" height="199" rx="16" class="illu-frame" />

      <!-- Barre supérieure -->
      <path d="M0 40 h320" class="illu-stroke-muted" stroke-width="1.5" />
      <circle cx="24" cy="20" r="4" class="illu-fill-primary" />
      <rect x="36" y="16" width="52" height="8" rx="4" class="illu-bar-strong" />
      <rect x="252" y="14" width="48" height="12" rx="6" class="illu-bar-faint" />

      <!-- Rail latéral -->
      <path d="M76 40 v160" class="illu-stroke-muted" stroke-width="1.5" />
      <rect x="16" y="56" width="44" height="8" rx="4" class="illu-bar-strong" />
      <rect x="16" y="76" width="36" height="7" rx="3.5" class="illu-bar-soft" />
      <rect x="16" y="94" width="44" height="7" rx="3.5" class="illu-bar-soft" />
      <rect x="16" y="112" width="30" height="7" rx="3.5" class="illu-bar-soft" />
      <rect x="16" y="130" width="40" height="7" rx="3.5" class="illu-bar-soft" />

      <!-- Cartes de contenu -->
      <rect x="92" y="56" width="94" height="58" rx="10" class="illu-fill-surface" />
      <rect x="104" y="68" width="44" height="6" rx="3" class="illu-bar-soft" />
      <rect x="104" y="94" width="14" height="10" rx="2" class="illu-fill-primary" />
      <rect x="122" y="86" width="14" height="18" rx="2" class="illu-fill-primary" />
      <rect x="140" y="78" width="14" height="26" rx="2" class="illu-fill-primary" />
      <rect x="158" y="90" width="14" height="14" rx="2" class="illu-fill-primary" />

      <rect x="198" y="56" width="106" height="58" rx="10" class="illu-fill-surface" />
      <rect x="210" y="68" width="52" height="6" rx="3" class="illu-bar-soft" />
      <path
        d="M210 100 L228 88 L246 94 L264 76 L292 84"
        class="illu-ring-primary"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <rect x="92" y="126" width="212" height="26" rx="8" class="illu-fill-surface" />
      <rect x="104" y="135" width="76" height="8" rx="4" class="illu-bar-soft" />
      <rect x="266" y="133" width="26" height="12" rx="6" class="illu-fill-primary" />

      <rect x="92" y="162" width="212" height="26" rx="8" class="illu-fill-surface" />
      <rect x="104" y="171" width="98" height="8" rx="4" class="illu-bar-soft" />
      <rect x="266" y="169" width="26" height="12" rx="6" class="illu-bar-faint" />
    </svg>
  }
}
