@switch (mode()) {
  @case ('guided') {
    <!-- Mode Assisté : l'échelle dogon, entaillée marche après marche, qui
         mène au grenier. On monte une étape à la fois ; la marche en cours
         porte la couleur. -->
    <svg
      viewBox="0 0 320 200"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="w-full h-full mode-illu"
      aria-hidden="true"
      focusable="false"
    >
      <g transform="translate(96 18) scale(2)" stroke-width="0.8">
        <path d="M42 40 L44 74 H76 L78 40" stroke-width="1"/>

        <path d="M46 62 L50 66 L54 62 L58 66 L62 62 L66 66 L70 62 L74 66" stroke-width="0.6" opacity=".7"/>
        <rect x="54" y="48" width="12" height="11" rx="1"/>
      </g>
      <g transform="translate(30 16) scale(2)" stroke-width="0.8">
        <path d="M36 82 H84" opacity=".4"/>
        <path d="M42 82 C46 60 54 30 58 16 M56 82 C58 60 64 30 68 16" stroke-width="1"/>
        <path d="M58 16 C56 10 52 6 48 4 M68 16 C70 10 74 6 78 4 M58 16 H68" stroke-width="1"/>

        <g style="color: var(--color-primary-500)">
          <path d="M50.4 54 L62.4 54 L60.4 49" stroke-width="0.9"/>
        </g>
        <path d="M53.6 43 L65.6 43 L63.6 38" stroke-width="0.7"/>
        <path d="M56.8 32 L68.8 32 L66.8 27" stroke-width="0.7"/>
        <path d="M60 21 L72 21 L70 16" stroke-width="0.7"/>
      </g>
    </svg>
  }

  @case ('chat') {
    <!-- Mode Chat : le tambour parleur, qui converse à distance. Ses ondes
         battent doucement, comme une réponse en train de venir. -->
    <svg
      viewBox="0 0 320 200"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="w-full h-full mode-illu"
      aria-hidden="true"
      focusable="false"
    >
      <g transform="translate(34 7.6) scale(2.1)" stroke-width="0.7">
        <ellipse cx="60" cy="20" rx="16" ry="4.5" stroke-width="1"/>
        <ellipse cx="60" cy="68" rx="16" ry="4.5" stroke-width="1"/>
        <path d="M44 20 C51 34 51 54 44 68 M76 20 C69 34 69 54 76 68"/>
        <path d="M46 22.7 L46 66.7 M49.5 24 L49.5 68 M53 25 L53 69 M56.5 25.5 L56.5 69.5 M60 25.5 L60 69.5 M63.5 25 L63.5 69 M67 24 L67 68 M70.5 22.7 L70.5 66.7" stroke-width="0.5" opacity=".6"/>
        <path d="M44 44 H76" stroke-width="0.6" opacity=".6"/>
        <path d="M50 34 L54 38 L50 42 M70 34 L66 38 L70 42 M50 46 L54 50 L50 54 M70 46 L66 50 L70 54" stroke-width="0.6" opacity=".75"/>
        <path d="M78 76 C88 70 94 62 96 52" stroke-width="1"/>
        <g class="mode-illu__beat" style="color: var(--color-primary-500)" stroke-width="0.9">
          <path d="M88 22 C92 26 92 32 88 36"/>
          <path d="M94 16 C101 23 101 35 94 42"/>
          <path d="M32 22 C28 26 28 32 32 36"/>
          <path d="M26 16 C19 23 19 35 26 42"/>
        </g>
      </g>
    </svg>
  }

  @default {
    <!-- Mode Avancé : le plateau d'awalé, tout le jeu à découvert. Chaque
         case est à portée de main ; on sème où l'on veut. -->
    <svg
      viewBox="0 0 320 200"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="w-full h-full mode-illu"

      <g transform="translate(10 -12) scale(2.5)" stroke-width="0.6">

        <path d="M28.4 51.4h0.01 M31.6 52.6h0.01 M31.4 51h0.01 M28.8 53h0.01" stroke-width="1"/>
        <ellipse cx="42" cy="52" rx="4.8" ry="3.6"/>
        <path d="M40.4 51.4h0.01 M43.6 52.6h0.01" stroke-width="1"/>

}
