<fieldset class="cg-wrap" [disabled]="disabled()">
  <legend class="cg-legend">
    <span class="cg-title">{{ 'common.creativity.title' | translate }}</span>
    <span class="cg-help">{{ 'common.creativity.help' | translate }}</span>
  </legend>

  <!-- La jauge : elle se remplit à mesure que l'IA prend de décisions. -->
  <div class="cg-meter" aria-hidden="true">
    <span class="cg-meter-fill" [style.width.%]="fill()"></span>
  </div>

  <div class="cg-levels" role="radiogroup" [attr.aria-describedby]="uid + '-desc'" (keydown)="onKeydown($event)">
    @for (level of levels; track level) {
      <button
        type="button"
        role="radio"
        class="cg-level"
        [class.cg-active]="value() === level"
        [attr.aria-checked]="value() === level"
        [attr.tabindex]="value() === level ? 0 : -1"
        [attr.data-level]="level"
        (click)="select(level)"
      >
        <span class="cg-level-name">{{ 'common.creativity.levels.' + level + '.label' | translate }}</span>
        <span class="cg-level-hint">{{ 'common.creativity.levels.' + level + '.hint' | translate }}</span>
        @if (costs(); as c) {
          <span class="cg-level-cost">{{ 'common.creativity.cost' | translate: { cost: c[level] } }}</span>
        }
      </button>
    }
  </div>

  <p class="cg-desc" [id]="uid + '-desc'" aria-live="polite">
    {{ 'common.creativity.levels.' + value() + '.description' | translate }}
  </p>
</fieldset>
