<!-- Page introuvable : même état d'erreur que le reste du tableau de bord. -->
<div class="min-h-screen flex items-center justify-center p-6">
  <app-error-state
    class="w-full"
    scene="not-found"
    [title]="'notFound.title' | translate"
    [message]="'notFound.subtitle' | translate"
  >
    <a routerLink="/home" class="inner-button">{{ 'notFound.buttons.home' | translate }}</a>
    <a routerLink="/console" class="outer-button">{{ 'notFound.buttons.dashboard' | translate }}</a>
  </app-error-state>
</div>
