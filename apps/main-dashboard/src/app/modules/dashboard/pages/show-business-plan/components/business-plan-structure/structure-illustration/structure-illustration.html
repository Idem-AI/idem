@switch (kind()) {
  @case ('bank') {
    <!-- Banque : l'établissement -->
    <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="bp-illu" aria-hidden="true" focusable="false">
      <path
        d="M14 19 L32 9 L50 19 Z"
        class="illu-accent-soft illu-accent-line"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
      <rect x="18" y="22" width="4" height="12" rx="1" class="illu-ink-soft" />
      <rect x="26" y="22" width="4" height="12" rx="1" class="illu-ink-soft" />
      <rect x="34" y="22" width="4" height="12" rx="1" class="illu-ink-soft" />
      <rect x="42" y="22" width="4" height="12" rx="1" class="illu-ink-soft" />
      <rect x="14" y="36" width="36" height="3" rx="1.5" class="illu-ink" />
    </svg>
  }

  @case ('investor') {
    <!-- Investisseur : une croissance -->
    <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="bp-illu" aria-hidden="true" focusable="false">
      <path d="M12 39 H52" class="illu-line" stroke-width="1.5" stroke-linecap="round" />
      <rect x="15" y="31" width="6" height="8" rx="1.5" class="illu-ink-faint" />
      <rect x="24" y="26" width="6" height="13" rx="1.5" class="illu-ink-soft" />
      <rect x="33" y="20" width="6" height="19" rx="1.5" class="illu-ink-soft" />
      <rect x="42" y="13" width="6" height="26" rx="1.5" class="illu-accent" />
      <path
        d="M18 26 L27 21 L36 15 L45 8"
        class="illu-accent-line"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }

  @case ('grant') {
    <!-- Bailleur : un projet qu'on fait pousser -->
    <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="bp-illu" aria-hidden="true" focusable="false">
      <path d="M22 32 H42 L39.5 40 H24.5 Z" class="illu-ink-soft" />
      <path d="M32 32 V19" class="illu-accent-line" stroke-width="1.6" stroke-linecap="round" />
      <path
        d="M32 27 C26.5 27 22 24 21 18.5 C26.5 18.5 31 21.5 32 27 Z"
        class="illu-accent-soft illu-accent-line"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
      <path
        d="M32 22 C37.5 22 42 19 43 13.5 C37.5 13.5 33 16.5 32 22 Z"
        class="illu-accent-soft illu-accent-line"
        stroke-width="1.4"
        stroke-linejoin="round"
      />
    </svg>
  }

  @case ('internal') {
    <!-- Équipe : un cap à tenir -->
    <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="bp-illu" aria-hidden="true" focusable="false">
      <circle cx="30" cy="26" r="14" class="illu-line" stroke-width="1.5" />
      <circle cx="30" cy="26" r="8" class="illu-line-strong" stroke-width="1.5" />
      <circle cx="30" cy="26" r="2.5" class="illu-accent" />
      <path d="M31.8 24.2 L47 9" class="illu-accent-line" stroke-width="1.6" stroke-linecap="round" />
      <path d="M47 9 H52 M47 9 V4" class="illu-accent-line" stroke-width="1.6" stroke-linecap="round" />
    </svg>
  }

  @default {
    <!-- Polyvalent : un dossier complet -->
    <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="bp-illu" aria-hidden="true" focusable="false">
      <rect
        x="25"
        y="9"
        width="21"
        height="29"
        rx="3"
        class="illu-surface illu-line"
        stroke-width="1.2"
        transform="rotate(8 35.5 23.5)"
      />
      <rect x="18" y="10" width="21" height="29" rx="3" class="illu-surface illu-line-strong" stroke-width="1.5" />
      <rect x="22" y="15" width="13" height="3" rx="1.5" class="illu-accent" />
      <rect x="22" y="22" width="11" height="2" rx="1" class="illu-ink-soft" />
      <rect x="22" y="27" width="9" height="2" rx="1" class="illu-ink-soft" />
      <rect x="22" y="32" width="12" height="2" rx="1" class="illu-ink-faint" />
    </svg>
  }
}
