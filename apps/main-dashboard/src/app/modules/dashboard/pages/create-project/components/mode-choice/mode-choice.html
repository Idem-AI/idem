<!-- Dernier écran de la création, une fois le projet enregistré : on choisit
     comment travailler avant d'ouvrir l'espace. Pas de retour possible, le
     projet existe déjà. En-tête serré : les trois modes tiennent dans la
     hauteur d'un petit portable sans faire défiler. -->
<section class="w-full max-w-6xl mx-auto px-4 sm:px-6 py-4 sm:py-6 text-text-primary animate-fadeIn">
  <header class="mb-5 sm:mb-6">
    <h1 class="text-2xl sm:text-3xl font-bold leading-tight">
      {{ 'dashboard.createProject.modeChoice.title' | translate }}
    </h1>
    <!-- Le « rien n'est définitif » vit ici, avec la consigne, et dit où se
         trouve la bascule : c'est au moment de choisir qu'il rassure. -->
    <p class="mt-1.5 text-sm sm:text-base text-text-tertiary">
      {{ 'dashboard.createProject.modeChoice.subtitle' | translate }}
    </p>
  </header>

  <!-- Chaque carte est le bouton : un seul geste, et un seul arrêt au clavier.
       Sous 1024 px, les cartes s'empilent en lignes basses — illustration,
       texte, puis le bouton à droite ; sur téléphone, seule la phrase « pour
       vous si… » reste, et un chevron remplace le bouton, pour que les trois
       modes tiennent à l'écran. -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-3 sm:gap-4">
    @for (card of cards; track card.mode) {
      @let recommended = card.mode === recommendedMode();
      <button
        type="button"
        (click)="onSelect(card.mode)"
        class="mode-card glass-card w-full text-left p-4 sm:p-5 flex items-center lg:flex-col lg:items-stretch gap-4"
        [class.mode-card--recommended]="recommended"
      >
        <app-mode-illustration
          class="w-16 h-12 sm:w-28 sm:h-[4.5rem] lg:w-full lg:h-24 shrink-0"
          [mode]="card.uiMode"
        />

        <span class="flex flex-col flex-1 min-w-0">
          <!-- La recommandation est posée à côté du titre de la carte qu'elle
               désigne : les trois titres restent alignés, et l'étiquette dit
               d'où vient le conseil quand il s'appuie sur les réponses. -->
          <span class="flex flex-wrap items-center gap-x-2.5 gap-y-1">
            <span class="text-lg sm:text-xl font-bold leading-tight text-text-primary">
              {{ 'dashboard.createProject.modeChoice.' + card.i18nKey + '.title' | translate }}
            </span>
            @if (recommended) {
              <span class="tag mode-card__tag">
                {{
                  (isPersonalized()
                    ? 'dashboard.createProject.modeChoice.recommendedForYou'
                    : 'dashboard.createProject.modeChoice.recommended'
                  ) | translate
                }}
              </span>
            }
          </span>
          <span class="mt-1 text-sm text-text-secondary leading-snug hidden sm:block">
            {{ 'dashboard.createProject.modeChoice.' + card.i18nKey + '.description' | translate }}
          </span>
          <span class="mt-1 sm:mt-2 text-sm text-text-tertiary leading-snug">
            {{ 'dashboard.createProject.modeChoice.' + card.i18nKey + '.forWho' | translate }}
          </span>
        </span>

        <span
          class="mode-card__cta button-sm shrink-0 lg:w-full items-center justify-center whitespace-nowrap"
          [class.inner-button]="recommended"
          [class.outer-button]="!recommended"
        >
          {{ 'dashboard.createProject.modeChoice.' + card.i18nKey + '.button' | translate }}
        </span>
        <i class="mode-card__chevron pi pi-angle-right text-text-tertiary" aria-hidden="true"></i>
      </button>
    }
  </div>
</section>
