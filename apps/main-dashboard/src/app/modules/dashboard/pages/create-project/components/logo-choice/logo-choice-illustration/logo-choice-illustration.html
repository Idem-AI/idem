@if (kind() === 'import') {
  <!-- Import : un fichier image qu'on dépose, et les formats acceptés -->
  <svg
    viewBox="0 0 320 200"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    class="w-full h-full logo-illu"
    role="img"
    aria-hidden="true"
  >
    <rect x="0.5" y="0.5" width="319" height="199" rx="16" class="illu-frame" />

    <!-- Zone de dépôt -->
    <rect
      x="62"
      y="26"
      width="200"
      height="110"
      rx="16"
      class="illu-dropzone"
      stroke-width="2"
      stroke-dasharray="8 8"
    />

    <!-- Le fichier : une feuille à coin corné -->
    <path
      d="M132 34 h44 l20 20 v60 a8 8 0 0 1 -8 8 h-56 a8 8 0 0 1 -8 -8 v-72 a8 8 0 0 1 8 -8 z"
      class="illu-fill-card"
    />
    <path d="M176 34 l20 20 h-20 z" class="illu-fold" />

    <!-- Glyphe « image » : soleil et montagnes, lu partout -->
    <rect x="136" y="50" width="48" height="40" rx="6" class="illu-ring-muted" stroke-width="2" />
    <circle cx="149" cy="62" r="4.5" class="illu-fill-primary" />
    <path d="M139 88 L152 70 L161 80 L168 73 L181 88 Z" class="illu-fill-primary" />

    <!-- Nom du fichier -->
    <rect x="136" y="98" width="42" height="5" rx="2.5" class="illu-bar-soft" />
    <rect x="136" y="108" width="26" height="5" rx="2.5" class="illu-bar-faint" />

    <!-- Pastille d'envoi -->
    <circle cx="196" cy="114" r="17" class="illu-fill-primary" />
    <path
      d="M196 122 v-16 m-6 6 l6 -6 l6 6"
      class="illu-stroke-inverse"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Formats acceptés, écrits en toutes lettres -->
    <rect x="52" y="152" width="64" height="26" rx="13" class="illu-fill-surface" />
    <text x="84" y="169" text-anchor="middle" class="illu-chip-text">SVG</text>

    <rect x="128" y="152" width="64" height="26" rx="13" class="illu-fill-surface" />
    <text x="160" y="169" text-anchor="middle" class="illu-chip-text">PNG</text>

    <rect x="204" y="152" width="64" height="26" rx="13" class="illu-fill-surface" />
    <text x="236" y="169" text-anchor="middle" class="illu-chip-text">JPG</text>
  </svg>
} @else {
  <!-- Génération IA : une baguette produit plusieurs logos, un est retenu -->
  <svg
    viewBox="0 0 320 200"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    class="w-full h-full logo-illu"
    role="img"
    aria-hidden="true"
  >
    <rect x="0.5" y="0.5" width="319" height="199" rx="16" class="illu-frame" />

    <!-- La baguette pointe vers la proposition retenue -->
    <path
      d="M124 16 L153 45"
      class="illu-wand"
      stroke-width="7"
      stroke-linecap="round"
    />
    <path
      d="M160 42 L163.5 50.5 L172 54 L163.5 57.5 L160 66 L156.5 57.5 L148 54 L156.5 50.5 Z"
      class="illu-fill-primary illu-spark"
    />
    <path
      d="M180 24 L182 29 L187 31 L182 33 L180 38 L178 33 L173 31 L178 29 Z"
      class="illu-fill-primary illu-spark-sm"
    />
    <path
      d="M114 40 L116 45 L121 47 L116 49 L114 54 L112 49 L107 47 L112 45 Z"
      class="illu-fill-primary illu-spark-sm illu-spark-delay"
    />

    <!-- Proposition 1 : une marque géométrique -->
    <rect x="32" y="70" width="76" height="88" rx="12" class="illu-fill-surface" />
    <polygon
      points="90,104 80,121.3 60,121.3 50,104 60,86.7 80,86.7"
      class="illu-ring-muted"
      stroke-width="3"
    />
    <rect x="56" y="136" width="28" height="6" rx="3" class="illu-bar-faint" />

    <!-- Proposition 2 : retenue -->
    <rect
      x="122"
      y="70"
      width="76"
      height="88"
      rx="12"
      class="illu-fill-selected"
      stroke-width="2.5"
    />
    <rect x="140" y="84" width="40" height="40" rx="10" class="illu-fill-primary" />
    <text x="160" y="112" text-anchor="middle" class="illu-monogram">A</text>
    <rect x="146" y="136" width="28" height="6" rx="3" class="illu-bar-soft" />
    <circle cx="190" cy="78" r="12" class="illu-fill-primary" />
    <path
      d="M185 78 l3.5 3.5 L195 74"
      class="illu-stroke-inverse"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Proposition 3 : une marque organique -->
    <rect x="212" y="70" width="76" height="88" rx="12" class="illu-fill-surface" />
    <path
      d="M250 84 c10 14 18 20 18 30 a18 18 0 0 1 -36 0 c0 -10 8 -16 18 -30 z"
      class="illu-ring-muted"
      stroke-width="3"
    />
    <rect x="236" y="136" width="28" height="6" rx="3" class="illu-bar-faint" />
  </svg>
}
