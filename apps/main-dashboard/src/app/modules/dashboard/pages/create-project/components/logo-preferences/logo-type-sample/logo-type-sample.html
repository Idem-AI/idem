<svg
  viewBox="0 0 268 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  class="w-full h-full logo-sample"
  role="img"
  aria-hidden="true"
>
  <!-- Le support sur lequel la marque est présentée -->
  <rect x="6" y="6" width="256" height="108" rx="14" class="sample-canvas" />

  @switch (type()) {
    @case ('icon') {
      <!-- Symbole seul : aucune lettre, la forme porte la marque -->
      <path
        d="M134 28 c17 19 27 28 27 41 a27 27 0 0 1 -54 0 c0 -13 10 -22 27 -41 z"
        class="sample-mark"
      />
      <circle cx="134" cy="70" r="9" class="sample-counter" />
    }

    @case ('name') {
      <!-- Nom complet : le mot est le logo -->
      <text x="134" y="72" text-anchor="middle" class="sample-wordmark">NOVARA</text>
      <rect x="94" y="84" width="80" height="4" rx="2" class="sample-rule" />
    }

    @default {
      <!-- Monogramme : l'initiale enfermée dans une forme -->
      <rect x="100" y="26" width="68" height="68" rx="18" class="sample-mark" />
      <text x="134" y="74" text-anchor="middle" class="sample-monogram">N</text>
    }
  }
</svg>
