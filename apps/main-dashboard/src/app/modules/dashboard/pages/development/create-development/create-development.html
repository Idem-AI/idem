<div class="cd space-y-8 p-4 md:p-2">
  <header>
    @if (current()) {
      <a routerLink="/project/development" class="cd-back">
        <i class="pi pi-arrow-left text-xs" aria-hidden="true"></i>
        {{ 'dashboard.siteApp.title' | translate }}
      </a>
    }
    <h1 class="text-2xl md:text-3xl font-bold text-text-primary">
      {{ 'dashboard.siteApp.create.title' | translate }}
    </h1>
    <p class="text-text-secondary mt-1 text-sm max-w-2xl">
      {{ 'dashboard.siteApp.create.subtitle' | translate }}
    </p>
  </header>

  @if (failed()) {
    <div class="glass-card cd-alert px-5 py-4 flex items-start gap-3" role="alert">
      <i class="pi pi-exclamation-circle text-danger text-lg mt-0.5" aria-hidden="true"></i>
      <p class="text-sm text-text-primary">{{ 'dashboard.siteApp.create.error' | translate }}</p>
    </div>
  }

  <div class="grid gap-4 md:grid-cols-2">
    <!-- Site vitrine -->
    <button
      type="button"
      class="glass-card cd-choice"
      [class.cd-choice--current]="current() === 'landing'"
      [disabled]="saving() !== null || !projectId()"
      (click)="choose('landing')"
    >
      <app-site-app-illustration scene="site" class="w-32" />
      <span class="cd-choice__title">
        {{ 'dashboard.siteApp.create.site.title' | translate }}
        @if (current() === 'landing') {
          <span class="tag">{{ 'dashboard.siteApp.create.current' | translate }}</span>
        }
      </span>
      <span class="cd-choice__body">{{ 'dashboard.siteApp.create.site.body' | translate }}</span>
      <ul class="cd-choice__list">
        <li>{{ 'dashboard.siteApp.create.site.point1' | translate }}</li>
        <li>{{ 'dashboard.siteApp.create.site.point2' | translate }}</li>
      </ul>
      <span class="cd-choice__cta">
        @if (saving() === 'landing') { <idem-loader size="xs" /> }
        {{ 'dashboard.siteApp.create.site.cta' | translate }}
        <i class="pi pi-arrow-right text-xs" aria-hidden="true"></i>
      </span>
    </button>

    <!-- Application complète -->
    <button
      type="button"
      class="glass-card cd-choice"
      [class.cd-choice--current]="current() === 'app'"
      [disabled]="saving() !== null || !projectId()"
      (click)="choose('app')"
    >
      <app-site-app-illustration scene="app" class="w-32" />
      <span class="cd-choice__title">
        {{ 'dashboard.siteApp.create.app.title' | translate }}
        @if (current() === 'app') {
          <span class="tag">{{ 'dashboard.siteApp.create.current' | translate }}</span>
        }
      </span>
      <span class="cd-choice__body">{{ 'dashboard.siteApp.create.app.body' | translate }}</span>
      <ul class="cd-choice__list">
        <li>{{ 'dashboard.siteApp.create.app.point1' | translate }}</li>
        <li>{{ 'dashboard.siteApp.create.app.point2' | translate }}</li>
        <li>{{ 'dashboard.siteApp.create.app.point3' | translate }}</li>
      </ul>
      <span class="cd-choice__cta">
        @if (saving() === 'app') { <idem-loader size="xs" /> }
        {{ 'dashboard.siteApp.create.app.cta' | translate }}
        <i class="pi pi-arrow-right text-xs" aria-hidden="true"></i>
      </span>
    </button>
  </div>

  <p class="text-xs text-text-tertiary max-w-2xl">{{ 'dashboard.siteApp.create.note' | translate }}</p>
</div>
