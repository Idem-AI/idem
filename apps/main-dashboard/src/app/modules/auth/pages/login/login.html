<main class="login">
  <!-- Emblème : le logo et le bouclier -->
  <section class="login__emblem">
    <div class="login__emblem-logo">
        <img
          src="/assets/icons/logo_white.png"
          [alt]="'dashboard.sidebar.logoAlt' | translate"
          class="login__logo dark:hidden"
          width="120"
          height="40"
        />
        <img
          src="/assets/icons/logo_dark.png"
          [alt]="'dashboard.sidebar.logoAlt' | translate"
          class="login__logo hidden dark:block"
          width="120"
          height="40"
        />
    </div>
    <app-shield-illustration class="login__shield" />
  </section>

  <!-- Connexion -->
  <section class="login__side">
    <header class="login__bar">
      <!-- Sur téléphone, la colonne de l'emblème est masquée : le logo vient ici. -->
      <div class="login__bar-logo">
        <img
          src="/assets/icons/logo_white.png"
          [alt]="'dashboard.sidebar.logoAlt' | translate"
          class="login__logo dark:hidden"
          width="120"
          height="40"
        />
        <img
          src="/assets/icons/logo_dark.png"
          [alt]="'dashboard.sidebar.logoAlt' | translate"
          class="login__logo hidden dark:block"
          width="120"
          height="40"
        />
      </div>
      <app-language-selector direction="down" align="right" />
    </header>

    <div class="login__form">
      <app-shield-illustration class="login__shield-compact" />
      <app-login-card (loginSuccess)="onLoginSuccess()" />
    </div>

    <p class="login__legal">
      {{ 'auth.legal.prefix' | translate }}
      <a [href]="termsUrl" target="_blank" rel="noopener">{{ 'auth.legal.terms' | translate }}</a>
      {{ 'auth.legal.and' | translate }}
      <a [href]="privacyUrl" target="_blank" rel="noopener">{{ 'auth.legal.privacy' | translate }}</a>.
    </p>
  </section>
</main>
