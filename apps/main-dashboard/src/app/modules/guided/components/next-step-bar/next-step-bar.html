@if (visible() && step(); as s) {
  <!-- Carte flottante, en haut au centre (posée par la mise en page) : elle ne repousse pas le contenu. -->
  <aside class="glass-card next-float" aria-live="polite" [attr.aria-label]="'guided.next.label' | translate">
    <span class="next-icon" aria-hidden="true"><i class="pi pi-compass"></i></span>
    <div class="min-w-0 flex-1">
      <p class="next-label">{{ 'guided.next.label' | translate }}</p>
      <p class="next-title">{{ 'guided.steps.' + s.id + '.title' | translate }}</p>
      <p class="next-why">{{ 'guided.steps.' + s.id + '.why' | translate }}</p>
    </div>
    <button type="button" class="inner-button button-sm shrink-0" (click)="open()">
      {{ 'guided.next.go' | translate }}
      <i class="pi pi-arrow-right" aria-hidden="true"></i>
    </button>
    <button type="button" class="button-icon shrink-0 next-close" [attr.aria-label]="'guided.next.later' | translate" (click)="dismiss()">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </aside>
}
