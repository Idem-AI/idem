<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Mockup IDEM · Publication LinkedIn (fil) · 556 × 780. Visuel 1:1 (flyer « square »). Emplacements : cf. ../README.md -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
{{{fontLinks}}}
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:556px;height:780px;overflow:hidden;background:#f4f2ee;font-family:'Inter',system-ui,sans-serif;color:rgba(0,0,0,.9);padding:8px;-webkit-font-smoothing:antialiased}
svg{display:block}
.card{background:#fff;border:1px solid #e0dfdc;border-radius:8px;overflow:hidden;height:764px}
.head{display:flex;gap:8px;padding:12px 16px 0}
.logo{width:48px;height:48px;border-radius:4px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.logo img{width:78%;height:78%;object-fit:contain}
.who{min-width:0;flex:1}
.name{font-size:14px;font-weight:600;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;line-height:16px;color:rgba(0,0,0,.6)}
.follow{font-size:16px;font-weight:600;color:#0a66c2;white-space:nowrap}
.text{padding:10px 16px 10px;font-size:14px;line-height:20px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;height:70px}
.media{width:538px;height:538px;background:#eef3f8;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.counts{margin:0 16px;padding:8px 0;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:rgba(0,0,0,.6);border-bottom:1px solid #e8e8e8}
.reacts{display:flex;align-items:center;gap:4px}
.reacts i{width:16px;height:16px;border-radius:50%;border:1px solid #fff;margin-right:-7px;display:block}
.actions{display:flex;justify-content:space-around;padding:4px 8px}
.actions div{display:flex;align-items:center;gap:6px;padding:10px 8px;font-size:14px;font-weight:600;color:rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="logo" style="background:{{avatarGround}}"><img src="{{avatarSrc}}" alt=""></div>
    <div class="who">
      <div class="name">{{brandName}}</div>
      <div class="sub">2,418 followers</div>
      <div class="sub" style="display:flex;align-items:center;gap:3px">2h · <svg width="12" height="12" viewBox="0 0 24 24" fill="rgba(0,0,0,.6)"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm6.9 6h-3a15.7 15.7 0 0 0-1.3-4.3A8 8 0 0 1 18.9 8zM12 4c.8 1.1 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.9 1.9-4zM4.3 14a8 8 0 0 1 0-4h3.4a16 16 0 0 0 0 4zm.8 2h3a15.7 15.7 0 0 0 1.3 4.3A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.3-4.3A15.7 15.7 0 0 0 8 8zm4 12c-.8-1.1-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.9-1.9 4zm2.3-6H9.7a14 14 0 0 1 0-4h4.6a14 14 0 0 1 0 4zm.3 6.3a15.7 15.7 0 0 0 1.3-4.3h3a8 8 0 0 1-4.3 4.3zm1.7-6.3a16 16 0 0 0 0-4h3.4a8 8 0 0 1 0 4z"/></svg></div>
    </div>
    <div class="follow">+ Follow</div>
  </div>
  <div class="text">{{postText}}</div>
  <div class="media"><img src="{{mediaSrc}}" alt=""></div>
  <div class="counts">
    <div class="reacts"><i style="background:#378fe9"></i><i style="background:#df704d"></i><i style="background:#6dae4f;margin-right:4px"></i>1,034</div>
    <div>15 comments · 17 reposts</div>
  </div>
  <div class="actions">
    <div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="1.8"><path d="M7 11v10H3V11zm0 0 4-8c1.7 0 2.5 1 2.5 2.5L13 9h6a2 2 0 0 1 2 2.3l-1.2 7.2A3 3 0 0 1 16.8 21H7" stroke-linejoin="round"/></svg>Like</div>
    <div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="1.8"><path d="M4 4h16v12H9l-5 4z" stroke-linejoin="round"/></svg>Comment</div>
    <div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="1.8"><path d="m17 3 3 3-3 3M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 0 0 4-4v-1"/></svg>Repost</div>
    <div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.6)" stroke-width="1.8"><path d="M22 3 9.2 10.1M22 3l-7 18-3.9-8.9L2 8.3z" stroke-linejoin="round"/></svg>Send</div>
  </div>
</div>
</body>
</html>
