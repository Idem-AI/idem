<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Mockup IDEM · Publication X (fil) · 600 × 420. Visuel 1,9:1 (flyer « banner »). Emplacements : cf. ../README.md -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{{{fontLinks}}}
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:600px;height:420px;overflow:hidden;background:#fff;font-family:'Inter',system-ui,sans-serif;color:#0f1419;-webkit-font-smoothing:antialiased}
svg{display:block}
.post{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #eff3f4;height:420px}
.av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.av img{width:70%;height:70%;object-fit:contain}
.col{flex:1;min-width:0}
.line{display:flex;align-items:center;gap:4px;font-size:15px;white-space:nowrap}
.line b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.line span{color:#536471;overflow:hidden;text-overflow:ellipsis}
.line .dots{margin-left:auto;color:#536471}
.text{margin-top:2px;font-size:15px;line-height:20px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.tags{color:#1d9bf0}
.media{margin-top:12px;width:516px;height:271px;border-radius:16px;border:1px solid #cfd9de;overflow:hidden;background:#f7f9f9}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.actions{margin-top:12px;display:flex;justify-content:space-between;color:#536471;font-size:13px;padding-right:8px}
.actions div{display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div class="post">
  <div class="av" style="background:{{avatarGround}}"><img src="{{avatarSrc}}" alt=""></div>
  <div class="col">
    <div class="line"><b>{{brandName}}</b><span>@{{handle}} · 2h</span><span class="dots">···</span></div>
    <div class="text">{{postText}} <span class="tags">{{hashtags}}</span></div>
    <div class="media"><img src="{{mediaSrc}}" alt=""></div>
    <div class="actions">
      <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4z" stroke-linejoin="round"/></svg>12</div>
      <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8"><path d="m17 3 3 3-3 3M20 6H8a4 4 0 0 0-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 0 0 4-4v-1"/></svg>34</div>
      <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>256</div>
      <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>12K</div>
      <div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#536471" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z" stroke-linejoin="round"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
