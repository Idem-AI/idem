<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Mockup IDEM · Publication Instagram (mobile) · 540 × 990. Visuel 4:5 (flyer « post »). Emplacements : cf. ../README.md -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Grand+Hotel&display=swap" rel="stylesheet">
{{{fontLinks}}}
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:540px;height:990px;overflow:hidden;background:#fff;font-family:'Inter',system-ui,sans-serif;color:#000;position:relative;-webkit-font-smoothing:antialiased}
svg{display:block}
.bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.word{font-family:'Grand Hotel',cursive;font-size:30px;line-height:1}
.icons{display:flex;gap:20px}
.phead{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px}
.ring{width:40px;height:40px;border-radius:50%;padding:2px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);flex:none}
.ring>div{width:100%;height:100%;border-radius:50%;border:2px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ring img{width:70%;height:70%;object-fit:contain}
.who{min-width:0;flex:1}
.handle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:#262626;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media{width:540px;height:675px;background:#efefef;overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.act{height:48px;display:flex;align-items:center;padding:0 12px;gap:16px}
.act .end{margin-left:auto}
.likes{padding:0 12px;font-size:14px;font-weight:600}
.cap{padding:4px 12px 0;font-size:14px;line-height:18px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.cap b{font-weight:600}
.tags{color:#00376b}
.more{padding:6px 12px 0;font-size:14px;color:#737373}
.time{padding:4px 12px 0;font-size:11px;color:#737373;letter-spacing:.2px}
.nav{position:absolute;left:0;right:0;bottom:0;height:52px;border-top:1px solid #dbdbdb;background:#fff;display:flex;align-items:center;justify-content:space-around}
.me{width:26px;height:26px;border-radius:50%;overflow:hidden;border:1.5px solid #000;display:flex;align-items:center;justify-content:center}
.me img{width:70%;height:70%;object-fit:contain}
</style>
</head>
<body>
<div class="bar">
  <div class="word">Instagram</div>
  <div class="icons">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M12 2.5c5.4 0 9.5 3.9 9.5 9s-4.1 9-9.5 9c-1 0-2-.1-2.9-.4L5 21.5l.4-3.6A8.7 8.7 0 0 1 2.5 11.5c0-5.1 4.1-9 9.5-9z"/><path d="m7 14 3.5-3.5 2.5 2 4-3.5" stroke-linejoin="round"/></svg>
  </div>
</div>
<div class="phead">
  <div class="ring"><div style="background:{{avatarGround}}"><img src="{{avatarSrc}}" alt=""></div></div>
  <div class="who"><div class="handle">{{handle}}</div><div class="sub">{{category}}</div></div>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="#000"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
</div>
<div class="media"><img src="{{mediaSrc}}" alt=""></div>
<div class="act">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M20.7 17.1A9.5 9.5 0 1 0 17.2 20.6L22 22z" stroke-linejoin="round"/></svg>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M22 3 9.2 10.1M22 3l-7 18-3.9-8.9L2 8.3z" stroke-linejoin="round"/></svg>
  <svg class="end" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M20 21 12 13.5 4 21V3h16z" stroke-linejoin="round"/></svg>
</div>
<div class="likes">1,284 likes</div>
<div class="cap"><b>{{handle}}</b> {{caption}} <span class="tags">{{hashtags}}</span></div>
<div class="more">View all 32 comments</div>
<div class="time">2 HOURS AGO</div>
<div class="nav">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="#000"><path d="M22 23h-6.001a1 1 0 0 1-1-1v-5.455a2.997 2.997 0 1 0-5.993 0V22a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V11.543a1.002 1.002 0 0 1 .31-.724l10-9.543a1.001 1.001 0 0 1 1.38 0l10 9.543a1.002 1.002 0 0 1 .31.724V22a1 1 0 0 1-1 1z"/></svg>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m21 21-5.2-5.2"/></svg>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M12 7v10M7 12h10"/></svg>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M2 8h20M9 2l3 6M15 2l3 6"/><path d="m10 11.5 5 3-5 3z" fill="#000"/></svg>
  <div class="me" style="background:{{avatarGround}}"><img src="{{avatarSrc}}" alt=""></div>
</div>
</body>
</html>
