# Infisical self-hosted (production) — gestionnaire de secrets d'api, appgen
# (serveur) et ideploy-api. Stack indépendante : sa propre base et son propre
# Redis, rien de partagé avec les services applicatifs. Les backends le
# joignent par son URL publique (INFISICAL_SITE_URL), servie par le
# reverse-proxy du serveur : le port n'est publié que sur 127.0.0.1.
# En développement, l'instance locale est dans docker-compose.dev.yml (profil `secrets`).
#
# Démarrage : docker compose -f docker-compose.infisical.yml up -d
# Config    : .env.infisical (voir .env.infisical.example — jamais commité)
# Mise à jour : sauvegarder la base, changer le tag épinglé ci-dessous, relancer.

services:
  infisical:
    container_name: idem-infisical-backend
    image: infisical/infisical:v0.165.16
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    env_file:
      - .env.infisical
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:${INFISICAL_PORT:-8085}:8080'
    networks:
      - infisical

  infisical-redis:
    container_name: idem-infisical-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - infisical_redis_data:/data
    networks:
      - infisical

  infisical-db:
    container_name: idem-infisical-db
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.infisical
    volumes:
      - infisical_pg_data:/var/lib/postgresql/data
    networks:
      - infisical
    healthcheck:
      # `$$` : évalué dans le conteneur, où .env.infisical est chargé
      # (un `${…}` serait résolu par Compose à la lecture du fichier, donc vide).
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  infisical_pg_data:
    driver: local
  infisical_redis_data:
    driver: local

networks:
  infisical:
