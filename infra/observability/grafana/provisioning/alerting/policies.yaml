apiVersion: 1

# Toutes les alertes partent par e-mail, à deux rythmes :
#  - critical : tout de suite, un e-mail par (règle, env, service, événement),
#    rappel toutes les heures tant que ça dure ;
#  - warning  : regroupées sur 5 minutes, rappel toutes les 12 heures.
policies:
  - orgId: 1
    receiver: idem-email
    group_by: ['alertname', 'env', 'service']
    group_wait: 5m
    group_interval: 15m
    repeat_interval: 12h
    routes:
      - receiver: idem-email
        object_matchers:
          - ['severity', '=', 'critical']
        group_by: ['alertname', 'env', 'service', 'event']
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 1h
