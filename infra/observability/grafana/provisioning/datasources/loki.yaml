apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 5000
      timeout: 60
      # Un clic sur un requestId dans une ligne ouvre toutes les lignes de
      # cette requête, tous services confondus.
      derivedFields:
        - name: requestId
          matcherType: regex
          matcherRegex: '"requestId":"([^"]+)"'
          datasourceUid: loki
          url: '{service=~".+"} |= "$${__value.raw}"'
          urlDisplayLabel: Suivre cette requête
