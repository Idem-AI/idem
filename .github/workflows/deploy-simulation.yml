name: Deploy Simulation

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/simulation/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.simulation'
      - '.github/workflows/deploy-simulation.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/simulation/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.simulation'
      - '.github/workflows/deploy-simulation.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      image: idem-simulation
      dockerfile: Dockerfile/prod/Dockerfile.simulation
      service: idem-simulation
      build-env: true
      deploy: true
      free-disk: false
    secrets: inherit
