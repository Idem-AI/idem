name: Security checks

# Deux garde-fous bloquants :
#  - gitleaks : aucun secret dans les commits poussés (le dépôt est public) ;
#  - npm audit : aucune dépendance de production au niveau « critical ».

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Analyse les commits de l'événement (push ou PR), pas tout l'historique :
      # les secrets historiques se traitent par révocation + purge, pas en CI.
      # Binaire officiel, vérifié par sa somme : gitleaks-action exige une
      # licence payante pour un dépôt d'organisation, et échouait à chaque run.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz

      - name: Run gitleaks
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before": scan its last commit only.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${HEAD_SHA}~1..${HEAD_SHA}"
          else
            RANGE="${BEFORE}..${HEAD_SHA}"
          fi
          echo "Scanning $RANGE"
          gitleaks git --redact --no-banner --log-opts="$RANGE" .

  dependencies:
    name: Dependency audit (critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'

      - name: npm audit (production, critical)
        run: npm audit --omit=dev --audit-level=critical

  secret-loader:
    name: Secret loader copies in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Chaque backend embarque sa copie (images Docker isolées) : elles doivent
      # rester strictement identiques.
      - name: Compare copies
        run: |
          set -e
          ref=apps/api/api/config/secret-loader.ts
          for copy in apps/ideploy-api/api/config/secret-loader.ts apps/appgen/apps/we-dev-next/src/config/secret-loader.ts apps/ivision/api/src/config/secret-loader.ts; do
            diff -u "$ref" "$copy"
          done

      # Même règle pour le format des journaux : Grafana et ses alertes
      # interrogent les services avec les mêmes requêtes
      # (docs/OBSERVABILITY.md). Une copie qui dérive casse ces requêtes en silence.
      - name: Compare log format copies
        run: |
          set -e
          ref=apps/api/api/config/log-format.ts
          for copy in apps/ideploy-api/api/config/log-format.ts apps/appgen/apps/we-dev-next/src/config/log-format.ts apps/ivision/api/src/config/log-format.ts; do
            diff -u "$ref" "$copy"
          done
