name: Deploy iVision API

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/ivision/api/**'
      - 'apps/ivision/core/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.ivision-api'
      - '.github/workflows/deploy-ivision-api.yml'
      - '.github/workflows/_service.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/ivision/api/**'
      - 'apps/ivision/core/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.ivision-api'
      - '.github/workflows/deploy-ivision-api.yml'
      - '.github/workflows/_service.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      image: ivision-api
      dockerfile: Dockerfile/prod/Dockerfile.ivision-api
      service: ivision-api
      build-env: false
      deploy: true
      free-disk: true
    secrets: inherit
