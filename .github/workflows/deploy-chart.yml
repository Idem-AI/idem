name: Deploy Chart

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/chart/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.chart'
      - '.github/workflows/deploy-chart.yml'
      - '.github/workflows/_service.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/chart/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.chart'
      - '.github/workflows/deploy-chart.yml'
      - '.github/workflows/_service.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      image: idem-chart
      dockerfile: Dockerfile/prod/Dockerfile.chart
      service: idem-chart
      # Not deployed by CI yet: see the note in _service.yml's PR.
      build-env: false
      deploy: false
      free-disk: false
    secrets: inherit
