name: Deploy Chart

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/chart/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.chart'
      - '.github/workflows/deploy-chart.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/chart/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.chart'
      - '.github/workflows/deploy-chart.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      image: idem-chart
      dockerfile: Dockerfile/prod/Dockerfile.chart
      service: idem-chart
      # Not deployed by CI yet: see the note in _service.yml's PR.
      build-env: false
      deploy: false
      free-disk: false
      build-args: |
        MERMAID_DOMAIN=mermaid.live
        MERMAID_ANALYTICS_URL=https://p.mermaid.live
        MERMAID_RENDERER_URL=https://mermaid.ink
        MERMAID_KROKI_RENDERER_URL=https://kroki.io
        MERMAID_IS_ENABLED_MERMAID_CHART_LINKS=true
    secrets: inherit
