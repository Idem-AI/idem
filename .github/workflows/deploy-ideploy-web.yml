name: Deploy iDeploy Web

concurrency:
  group: deploy-ideploy-web
  cancel-in-progress: false

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'apps/ideploy-web/**'
      - 'Dockerfile/prod/Dockerfile.ideploy-web'
      - 'packages/shared-models/**'
      - '.github/workflows/deploy-ideploy-web.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy iDeploy Web
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get commit info
        id: vars
        run: |
          echo "commit_id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Build, Push & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: IDEPLOY_API_URL,SERVICES_API_URL,SERVICES_DASHBOARD_URL,PUSHER_APP_KEY,PUSHER_HOST,PUSHER_PORT,PUSHER_SCHEME
          script: |
            set -e

            # Acquire lock to serialize deployment on the server (avoid parallel conflicts)
            exec 200>/tmp/idem-deploy.lock
            flock -x -w 600 200

            # Variables
            REPO_DIR="/root/idem"
            DEPLOYMENT_DIR="/root/application"
            BRANCH="${{ steps.vars.outputs.branch }}"
            COMMIT_ID="${{ steps.vars.outputs.commit_id }}"

            # Different tags for staging and production
            if [ "$BRANCH" = "main" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
              IMAGE_TAG="ghcr.io/idem-ai/ideploy-web:$COMMIT_ID"
            else
              IMAGE_TAG="ghcr.io/idem-ai/ideploy-web:$COMMIT_ID-staging"
            fi

            echo "Branch: $BRANCH"
            echo "Commit: $COMMIT_ID"
            echo "Image: $IMAGE_TAG"

            # Update repository
            cd $REPO_DIR

            # Clean git locks and corrupted index (parallel workflows)
            rm -f .git/index.lock
            rm -f .git/index

            # Retry loop for git operations (avoid parallel conflicts)
            for i in {1..5}; do
              sleep $((RANDOM % 3 + 1))
              if git checkout -f $BRANCH && git pull origin $BRANCH; then
                break
              fi
              echo "Retry $i/5..."
              rm -f .git/index.lock .git/index
            done

            # Build image — frontend env values are baked in at build time
            # (see apps/ideploy-web/scripts/set-env.js), not read at runtime.
            echo "Building Docker image..."
            docker build \
              -f Dockerfile/prod/Dockerfile.ideploy-web \
              --build-arg IDEPLOY_API_URL="$IDEPLOY_API_URL" \
              --build-arg SERVICES_API_URL="$SERVICES_API_URL" \
              --build-arg SERVICES_DASHBOARD_URL="$SERVICES_DASHBOARD_URL" \
              --build-arg PUSHER_APP_KEY="$PUSHER_APP_KEY" \
              --build-arg PUSHER_HOST="$PUSHER_HOST" \
              --build-arg PUSHER_PORT="$PUSHER_PORT" \
              --build-arg PUSHER_SCHEME="$PUSHER_SCHEME" \
              -t $IMAGE_TAG .

            # Push image
            echo "Pushing image to registry..."
            docker push $IMAGE_TAG

            # Determine environment and deploy
            if [ "$BRANCH" = "main" ] || [ "${{ github.event_name }}" = "pull_request" ]; then

              cd $DEPLOYMENT_DIR
              COMPOSE_FILE="docker-compose.prod.yml"
              SERVICE_NAME="ideploy-web"

              echo "Updating $COMPOSE_FILE..."
              sed -i "s|image: ghcr.io/idem-ai/ideploy-web:.*|image: $IMAGE_TAG|" $COMPOSE_FILE

              echo "Deploying to production..."
              docker-compose -f $COMPOSE_FILE pull $SERVICE_NAME
              docker-compose -f $COMPOSE_FILE up -d $SERVICE_NAME
            else
              cd $DEPLOYMENT_DIR
              COMPOSE_FILE="docker-compose.staging.yml"
              SERVICE_NAME="ideploy-web-staging"

              echo "Updating $COMPOSE_FILE..."
              sed -i "s|image: ghcr.io/idem-ai/ideploy-web:.*|image: $IMAGE_TAG|" $COMPOSE_FILE

              echo "Deploying to staging..."
              docker-compose -f $COMPOSE_FILE pull $SERVICE_NAME
              docker-compose -f $COMPOSE_FILE up -d $SERVICE_NAME
            fi

            # Cleanup
            echo "Cleaning up old images..."
            docker image prune -f

            echo "iDeploy Web deployed successfully!"
        env:
          IDEPLOY_API_URL: ${{ vars.IDEPLOY_API_URL }}
          SERVICES_API_URL: ${{ vars.SERVICES_API_URL }}
          SERVICES_DASHBOARD_URL: ${{ vars.SERVICES_DASHBOARD_URL }}
          PUSHER_APP_KEY: ${{ secrets.PUSHER_APP_KEY }}
          PUSHER_HOST: ${{ vars.PUSHER_HOST }}
          PUSHER_PORT: ${{ vars.PUSHER_PORT }}
          PUSHER_SCHEME: ${{ vars.PUSHER_SCHEME }}
