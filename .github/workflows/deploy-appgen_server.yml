name: Deploy AppGen server

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/appgen/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.appgen-server'
      - '.github/workflows/deploy-appgen_server.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/appgen/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.appgen-server'
      - '.github/workflows/deploy-appgen_server.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      image: appgen-server
      dockerfile: Dockerfile/prod/Dockerfile.appgen-server
      service: appgen-server
      build-env: false
      deploy: true
      free-disk: false
    secrets: inherit
