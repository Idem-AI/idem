name: Deploy Main dashboard

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/main-dashboard/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.main-dashboard'
      - '.github/workflows/deploy-main-dashboard.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/main-dashboard/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.main-dashboard'
      - '.github/workflows/deploy-main-dashboard.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      image: idem-main-dashboard
      dockerfile: Dockerfile/prod/Dockerfile.main-dashboard
      service: idem
      build-env: true
      deploy: true
      free-disk: false
    secrets: inherit
