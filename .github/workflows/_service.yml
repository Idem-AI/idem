name: Build & deploy a service (reusable)

# Builds one service's image on a GitHub runner, pushes it to ghcr.io, and on
# `main` swaps the image tag in the production compose file and restarts that
# service. The production server only pulls: nothing is built there any more
# (builds filled its disk, stopped Redis writes and held the deploy lock for
# up to 30 minutes).
#
#   pull_request → build only (the change is proved to build, nothing pushed)
#   push to dev  → build and push `<sha>-staging`
#   push to main → build and push `<sha>`, then deploy
#   manual run   → same as the branch it runs on

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/idem-ai/
        required: true
        type: string
      dockerfile:
        description: Dockerfile path from the repository root
        required: true
        type: string
      service:
        description: Service name in /root/application/docker-compose.prod.yml
        required: true
        type: string
      build-env:
        description: Write the public build variables (secret PROD_BUILD_ENV) to .env before building
        required: false
        type: boolean
        default: false
      deploy:
        description: Deploy on main (false = build and push only)
        required: false
        type: boolean
        default: true
      free-disk:
        description: Free the runner's disk first (large images)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Free disk space
        if: inputs.free-disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image tag
        id: meta
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          if [ "${{ github.ref_name }}" = "main" ]; then tag="$sha"; else tag="$sha-staging"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      # Front ends bake their public addresses at build time. Only public
      # values live in PROD_BUILD_ENV: no password or API key reaches an image.
      - name: Build variables
        if: inputs.build-env
        env:
          PROD_BUILD_ENV: ${{ secrets.PROD_BUILD_ENV }}
        run: |
          if [ -z "$PROD_BUILD_ENV" ]; then
            echo "::error::The PROD_BUILD_ENV secret is empty; this front end cannot be built without its addresses."
            exit 1
          fi
          printf '%s\n' "$PROD_BUILD_ENV" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          # GHCR_TOKEN (a token with write:packages) when the existing packages
          # are not linked to this repository; otherwise the job's own token,
          # which can write to packages linked to the repository.
          username: ${{ secrets.GHCR_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ghcr.io/idem-ai/${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          # Layers are cached per image between runs.
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
          provenance: false
          # Links a new package to this repository, so the job's token can write it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy ${{ inputs.service }}
    needs: build
    if: inputs.deploy && github.ref_name == 'main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: false
    steps:
      - name: Pull and restart on the production server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            IMAGE="ghcr.io/idem-ai/${{ inputs.image }}:${{ needs.build.outputs.tag }}"
            SERVICE="${{ inputs.service }}"
            cd /root/application
            COMPOSE="docker compose -f docker-compose.prod.yml"

            # Short, and only around the compose file: nothing is built here.
            exec 200>/tmp/idem-deploy.lock
            flock -x -w 120 200 || { echo "ERROR: another deployment holds /tmp/idem-deploy.lock; re-run this job."; exit 1; }

            if ! $COMPOSE config --services | grep -qx "$SERVICE"; then
              echo "ERROR: no service '$SERVICE' in docker-compose.prod.yml; add it before deploying."
              exit 1
            fi
            # The image line of this service only, whatever tag it had.
            sed -i "s|image: ghcr.io/idem-ai/${{ inputs.image }}:.*|image: $IMAGE|" docker-compose.prod.yml

            echo "Deploying $IMAGE as $SERVICE"
            $COMPOSE pull "$SERVICE"
            $COMPOSE up -d --no-deps "$SERVICE"
            docker image prune -f >/dev/null
            sleep 5
            $COMPOSE ps "$SERVICE"
