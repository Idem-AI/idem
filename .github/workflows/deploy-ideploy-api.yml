name: Deploy iDeploy API

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/ideploy-api/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.ideploy-api'
      - '.github/workflows/deploy-ideploy-api.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/ideploy-api/**'
      - 'packages/**'
      - 'Dockerfile/prod/Dockerfile.ideploy-api'
      - '.github/workflows/deploy-ideploy-api.yml'
      - '.github/workflows/_service.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service:
    uses: ./.github/workflows/_service.yml
    with:
      image: ideploy-api
      dockerfile: Dockerfile/prod/Dockerfile.ideploy-api
      # The API and every worker container run this image.
      service: ideploy-api ideploy-worker-1 ideploy-worker-2 ideploy-worker-3
      build-env: false
      deploy: true
      free-disk: false
    secrets: inherit
